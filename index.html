<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAHomiez — League Portal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

:root{
  --field:#00193A;
  --field-line:#0E2E52;
  --panel:#0A2A4D;
  --panel-2:#0F3661;
  --ink:#EDEDE4;
  --ink-dim:#9FB2C9;
  --gold:#F2C230;
  --win:#4C8C5A;
  --loss:#B4483A;
  --hair:#1B4470;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--field);
  color:var(--ink);
  font-family:'IBM Plex Sans',sans-serif;
  min-height:100vh;
}
.yard-lines{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image: repeating-linear-gradient(90deg, transparent, transparent 79px, var(--field-line) 79px, var(--field-line) 80px);
  opacity:.5;
}
.wrap{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:0 24px 80px;}

header{padding:36px 0 20px; border-bottom:1px solid var(--hair);}
.eyebrow-row{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;}
h1{
  font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase;
  letter-spacing:.5px; font-size:42px; margin:0; color:var(--ink);
}
h1 span{color:var(--gold);}
.league-meta{font-size:13px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace;}
.season-picker{display:flex; align-items:center; gap:10px; margin-top:14px;}
.season-picker select{
  background:var(--panel); border:1px solid var(--hair); color:var(--ink);
  font-family:'IBM Plex Mono',monospace; font-size:13px; padding:7px 10px; border-radius:3px;
}

nav{display:flex; gap:2px; margin-top:22px; flex-wrap:wrap;}
nav button{
  background:none; border:none; color:var(--ink-dim); font-family:'Oswald',sans-serif;
  font-size:15px; text-transform:uppercase; letter-spacing:.4px; padding:10px 18px;
  cursor:pointer; border-bottom:3px solid transparent; transition:color .15s, border-color .15s;
}
nav button:hover{color:var(--ink);}
nav button.active{color:var(--gold); border-bottom-color:var(--gold);}

main{padding-top:28px;}
.panel{background:var(--panel); border:1px solid var(--hair); border-radius:4px; padding:22px; margin-bottom:20px;}
.standings-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start;}
@media (max-width: 820px){ .standings-grid{grid-template-columns:1fr;} }
.section-h{font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:16px; margin:0 0 10px; letter-spacing:.3px;}
.keepers-grid{display:grid; grid-template-columns:1fr 1.3fr; gap:24px; align-items:start;}
@media (max-width: 820px){ .keepers-grid{grid-template-columns:1fr;} }
.ineligible-row td{opacity:.55;}
.keeper-pick-row td{background:rgba(242,194,48,.08);}
.keeper-pick-row td:first-child{border-left:2px solid var(--gold);}
.draft-grid-wrap{overflow-x:auto; padding-bottom:8px;}
.draft-scroll-top{overflow-x:auto; overflow-y:hidden; height:16px; margin-bottom:4px;}
.draft-scroll-top-inner{height:1px;}
.draft-grid-header{display:grid; grid-template-columns:34px repeat(var(--num-teams), minmax(80px,1fr)); gap:3px; margin-bottom:6px; position:sticky; top:0;}
.draft-row{display:grid; grid-template-columns:34px repeat(var(--num-teams), minmax(80px,1fr)); gap:3px; margin-bottom:3px;}
.draft-col-header{font-family:'Oswald',sans-serif; font-size:10.5px; text-transform:uppercase; text-align:center; padding:7px 2px; background:var(--panel-2); border:1px solid var(--hair); border-radius:4px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.draft-col-header.active-tab{background:var(--panel); border-bottom-color:var(--panel); border-bottom-left-radius:0; border-bottom-right-radius:0; position:relative; z-index:2;}
#draftScorecardPanel{position:relative;}
#draftScorecardPanel.open{margin:-6px 0 12px;}
#draftScorecardPanel.open::before{content:''; position:absolute; top:0; height:6px; left:var(--tab-left, 0px); width:var(--tab-width, 100px); background:var(--panel); border-left:1px solid var(--hair); border-right:1px solid var(--hair); z-index:1;}
#draftScorecardPanel .team-block{position:relative; background:var(--panel); border:1px solid var(--hair); border-radius:6px; padding:18px; margin-top:6px;}
.draft-grade{display:flex; align-items:center; justify-content:center; width:30px; height:30px; margin:5px auto 0; font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:700; letter-spacing:.01em; border-radius:50%; cursor:default;}
.draft-grade.grade-Aplus, .draft-grade.grade-A, .draft-grade.grade-Aminus{background:rgba(76,140,90,.22); color:#7BC492;}
.draft-grade.grade-Bplus, .draft-grade.grade-B, .draft-grade.grade-Bminus{background:rgba(242,194,48,.18); color:var(--gold);}
.draft-grade.grade-Cplus, .draft-grade.grade-C, .draft-grade.grade-Cminus{background:rgba(159,178,201,.16); color:var(--ink-dim);}
.draft-grade.grade-Dplus, .draft-grade.grade-D{background:rgba(180,120,58,.2); color:#D4954C;}
.draft-grade.grade-F{background:rgba(180,72,58,.22); color:#D97B68;}
.draft-col-header.clickable{cursor:pointer; transition:background .15s;}
.draft-col-header.clickable:hover{background:var(--panel);}
.scorecard-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:24px; align-items:start; margin-top:16px;}
@media (max-width: 820px){ .scorecard-grid{grid-template-columns:1fr;} }
.draft-row-label{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-dim); display:flex; align-items:center; justify-content:center;}
.draft-cell{border-radius:4px; padding:4px 5px; min-height:46px; display:flex; flex-direction:column; justify-content:center; gap:1px; color:#fff; font-size:10px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);}
.draft-cell-pick{font-family:'IBM Plex Mono',monospace; font-size:8px; opacity:.85;}
.draft-cell-player{font-weight:600; line-height:1.1; font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.draft-cell-pos{font-family:'IBM Plex Mono',monospace; font-size:8px; opacity:.85;}
.draft-cell-keeper{box-shadow: inset 0 0 0 2px var(--gold);}
.draft-cell-empty{background:var(--panel-2); opacity:.25;}
.draft-legend{display:flex; gap:16px; margin-top:16px; flex-wrap:wrap;}
.draft-legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace;}
.draft-legend-swatch{width:12px; height:12px; border-radius:3px; display:inline-block;}
.season-group-row td{background:var(--panel-2); font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--gold); font-weight:600; padding:6px 10px;}
.panel h2{font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:20px; margin:0 0 4px; letter-spacing:.3px;}
.panel .sub{color:var(--ink-dim); font-size:13px; margin:0 0 18px;}

table{width:100%; border-collapse:collapse; font-size:14px;}
th{
  text-align:left; font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;
  letter-spacing:.06em; color:var(--ink-dim); font-weight:500; padding:8px 10px; border-bottom:1px solid var(--hair);
}
td{padding:10px; border-bottom:1px solid var(--field-line);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
td.num, th.num{text-align:right; font-family:'IBM Plex Mono',monospace;}
.rank{color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; width:28px;}
.team-cell{display:flex; align-items:center; gap:10px;}
.team-name{font-weight:600;}
.team-handle{color:var(--ink-dim); font-size:12px; font-family:'IBM Plex Mono',monospace;}
.win-pill, .loss-pill{
  display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; padding:2px 7px; border-radius:2px;
}
.win-pill{background:rgba(76,140,90,.18); color:var(--win);}
.loss-pill{background:rgba(180,72,58,.18); color:var(--loss);}

.matchup-row{display:grid; grid-template-columns:1fr 70px 20px 70px 1fr; align-items:center; padding:14px 10px; border-bottom:1px solid var(--field-line); gap:8px;}
.matchup-row:last-child{border-bottom:none;}
.mt-team{font-weight:600; font-size:14px;}
.mt-team.right{text-align:right;}
.mt-score{font-family:'Oswald',sans-serif; font-size:22px; text-align:center;}
.mt-score.win{color:var(--gold);}
.mt-vs{text-align:center; color:var(--ink-dim); font-size:11px; font-family:'IBM Plex Mono',monospace;}

.week-picker{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:18px;}
.week-picker button{
  background:var(--panel-2); border:1px solid var(--hair); color:var(--ink-dim);
  font-family:'IBM Plex Mono',monospace; font-size:12px; padding:5px 10px; border-radius:2px; cursor:pointer;
}
.week-picker button.active{background:var(--gold); color:#1a1509; border-color:var(--gold); font-weight:600;}

.trophy-section-title{font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:17px; letter-spacing:.4px; color:var(--ink); margin:26px 0 14px; padding-bottom:8px; border-bottom:2px solid var(--hair);}
.trophy-section-title:first-of-type{margin-top:2px;}
.trophy-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:16px;}
.trophy-card{background:linear-gradient(160deg, var(--panel-2), var(--panel)); border:1px solid var(--hair); border-left:3px solid var(--gold); border-radius:6px; padding:18px; position:relative; transition:transform .15s ease, box-shadow .15s ease;}
.trophy-card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(0,0,0,.4);}
.trophy-icon{display:block; font-size:19px; margin-bottom:8px; filter:grayscale(.15);}
.trophy-label{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; color:var(--gold); letter-spacing:.06em; margin-bottom:7px;}
.trophy-value{font-family:'Oswald',sans-serif; font-size:30px; margin-bottom:5px; line-height:1.05;}
.trophy-sub{color:var(--ink-dim); font-size:12.5px; line-height:1.4;}

.history-season{display:flex; align-items:center; gap:16px; padding:12px 10px; border-bottom:1px solid var(--field-line); flex-wrap:wrap;}
.history-season:last-child{border-bottom:none;}
.history-year{font-family:'Oswald',sans-serif; font-size:20px; width:80px; color:var(--gold);}
.history-champ{flex:1; min-width:120px;}
.history-champ .label{font-size:11px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; text-transform:uppercase;}
.history-champ .val{font-weight:600;}
.history-sub{font-size:11px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace;}
.history-season.clickable{cursor:pointer; transition:background .15s;}
.history-season.clickable:hover{background:rgba(255,255,255,.03);}
.history-season .chevron{display:inline-block; font-size:13px; color:var(--ink-dim); transition:transform .15s; margin-left:2px;}
.history-season.expanded .chevron{transform:rotate(90deg); color:var(--gold);}
.history-season.expanded{background:rgba(255,255,255,.03);}
.history-detail{max-height:0; overflow:hidden; transition:max-height .2s ease;}
.history-detail.open{max-height:3000px;}
.history-detail-inner{padding:18px 10px 26px; border-bottom:1px solid var(--field-line);}
.champ-strip{display:flex; gap:12px; margin-bottom:16px;}
.champ-card{flex:1; margin-bottom:0;}
.champ-card.gold-card{border-left:3px solid var(--gold);}
.champ-card.silver-card{border-left:3px solid var(--ink-dim);}
.bracket-wrap{display:flex; align-items:stretch; gap:0; overflow-x:auto; padding-bottom:6px;}
.bracket-col{min-width:190px; flex:1; padding-right:20px; margin-right:20px; border-right:2px solid var(--hair); position:relative;}
.bracket-col:last-child{border-right:none; margin-right:0; padding-right:0;}
.bracket-col::after{content:'▸'; position:absolute; right:5px; top:50%; transform:translateY(-50%); color:var(--hair); font-size:18px;}
.bracket-col:last-child::after{content:'';}
.bracket-col-label{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; color:var(--ink-dim); margin-bottom:10px; letter-spacing:.05em;}
.bracket-col-games{display:flex; flex-direction:column; justify-content:space-around; height:calc(100% - 24px); gap:14px;}
.bracket-card{background:var(--panel-2); border:1px solid var(--hair); border-radius:4px; overflow:hidden;}
.bracket-card.bye-card{opacity:.85;}
.bracket-game-label{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-dim); background:rgba(255,255,255,.03); padding:5px 10px; border-bottom:1px solid var(--hair);}
.bracket-team{display:flex; align-items:center; gap:8px; padding:8px 10px; font-size:13px; border-bottom:1px solid var(--hair);}
.bracket-team:last-child{border-bottom:none;}
.bracket-team.winner{color:var(--gold); font-weight:600;}
.bracket-team.bye-slot{color:var(--ink-dim); font-style:italic; font-size:11px; text-transform:uppercase; letter-spacing:.05em;}
.bracket-team-name{flex:1;}
.seed{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-dim); background:var(--field); border:1px solid var(--hair); border-radius:2px; padding:1px 5px; min-width:14px; text-align:center; flex-shrink:0;}
.bracket-team.winner .seed{color:var(--gold); border-color:var(--gold);}

.team-block{margin-bottom:26px;}
.team-block h3{
  font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:16px; margin:0 0 8px;
  padding-bottom:8px; border-bottom:1px solid var(--hair); display:flex; justify-content:space-between; align-items:baseline;
}
.team-block h3 .handle{font-size:12px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; text-transform:none;}
.year-tag{font-family:'IBM Plex Mono',monospace; font-size:11px; padding:2px 7px; border-radius:2px; background:rgba(242,194,48,.15); color:var(--gold);}
.year-tag.first{background:rgba(76,140,90,.15); color:var(--win);}
.year-tag.maxed{background:rgba(180,72,58,.18); color:var(--loss);}

.state-msg{color:var(--ink-dim); font-size:14px; padding:30px 0; text-align:center; font-family:'IBM Plex Mono',monospace;}
.state-msg.error{color:var(--loss);}
.spinner{
  display:inline-block; width:14px; height:14px; border:2px solid var(--hair); border-top-color:var(--gold);
  border-radius:50%; animation:spin .7s linear infinite; margin-right:8px; vertical-align:-2px;
}
@keyframes spin{to{transform:rotate(360deg);}}
footer{color:var(--ink-dim); font-size:12px; text-align:center; padding:30px 0 10px; font-family:'IBM Plex Mono',monospace;}
</style>

// ---- state ----
let seasons = [];        // [{league_id, season, status}], most recent first
let seasonData = {};     // season(year str) -> {league, rosters, users, teams:{roster_id:{name,handle,owner_id}}}
let matchupCache = {};   // `${season}-${week}` -> matchups array
let activeTab = "standings";
let activeSeason = null;
let activeWeek = 1;

async function getJSON(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error(`Sleeper API ${res.status} on ${url}`);
  return res.json();
}

function ordYear(n){ return n===1?"1st":n===2?"2nd":n===3?"3rd":n+"th"; }
function fmtPct(w,l){ const p = w/(((w||0)+(l||0))||1); return p>=1 ? "1.000" : p.toFixed(3).replace(/^0/,""); }

async function buildSeasonChain(startId){
  let id = startId;
  let guard = 0;
  const chain = [];
  while(id && id !== "0" && guard < 25){
    guard++;
    const lg = await getJSON(`${API}/league/${id}`);
    chain.push({league_id:id, season: lg.season, status: lg.status, prev: lg.previous_league_id, name: lg.name});
    id = lg.previous_league_id;
  }
  return chain; // most recent first
}

async function loadSeasonCore(entry){
  const y = entry.season;
  if(seasonData[y]) return seasonData[y];
  const [rosters, users] = await Promise.all([
    getJSON(`${API}/league/${entry.league_id}/rosters`),
    getJSON(`${API}/league/${entry.league_id}/users`)
  ]);
  const userMap = {};
  users.forEach(u => userMap[u.user_id] = u);
  const teams = {};
  rosters.forEach(r => {
    const u = userMap[r.owner_id] || {};
    teams[r.roster_id] = {
      roster_id: r.roster_id,
      owner_id: r.owner_id,
      handle: u.username || u.display_name || "unknown",
      name: (u.metadata && u.metadata.team_name) || u.display_name || "Team " + r.roster_id,
      wins: r.settings?.wins ?? 0,
      losses: r.settings?.losses ?? 0,
      ties: r.settings?.ties ?? 0,
      fpts: (r.settings?.fpts ?? 0) + (r.settings?.fpts_decimal ?? 0)/100,
      fpts_against: (r.settings?.fpts_against ?? 0) + (r.settings?.fpts_against_decimal ?? 0)/100,
    };
  });
  seasonData[y] = { entry, rosters, users, teams };
  return seasonData[y];
}

async function getMatchups(season, week){
  const key = `${season}-${week}`;
  if(matchupCache[key]) return matchupCache[key];
  const entry = seasons.find(s => s.season === season);
  const m = await getJSON(`${API}/league/${entry.league_id}/matchups/${week}`);
  matchupCache[key] = m;
  return m;
}

function errorMsg(t){ return `<div class="state-msg error">${t}</div>`; }

// ---------- STANDINGS ----------
let allTimeCache = null;

function getOwnerRecordForYahooSeason(y, owner){
  for(const s of y.standings){
    if(TEAM_OWNER_BY_SEASON[y.season] && TEAM_OWNER_BY_SEASON[y.season][s.team] === owner) return s;
  }
  return null;
}

async function computeAllTimeStandings(){
  if(allTimeCache) return allTimeCache;
  const totals = {}; // owner -> {wins,losses,ties,pf,pa,titles}
  const bump = (owner, w,l,t,pf,pa) => {
    const rec = totals[owner] || {wins:0,losses:0,ties:0,pf:0,pa:0,titles:0};
    rec.wins+=w; rec.losses+=l; rec.ties+=t||0; rec.pf+=pf; rec.pa+=pa;
    totals[owner]=rec;
  };
  // Yahoo era
  YAHOO_SEASONS.forEach(y => {
    const map = TEAM_OWNER_BY_SEASON[y.season] || {};
    y.standings.forEach(s => {
      const owner = map[s.team];
      if(owner) bump(owner, s.w, s.l, s.t, s.pf, s.pa);
    });
    const champOwner = YAHOO_MANAGER_TO_OWNER[y.champion.manager];
    if(champOwner) (totals[champOwner]||bump(champOwner,0,0,0,0,0)) && (totals[champOwner].titles += 1);
  });
  // Sleeper era
  for(const entry of seasons){
    if(entry.status === "pre_draft" || entry.status === "drafting") continue;
    const data = await loadSeasonCore(entry);
    Object.values(data.teams).forEach(t => bump(t.handle, t.wins, t.losses, t.ties||0, t.fpts, t.fpts_against));
    try{
      const bracket = await getJSON(`${API}/league/${entry.league_id}/winners_bracket`);
      const final = bracket.find(g => g.p === 1 && g.w);
      if(final){
        const champ = data.teams[final.w];
        if(champ && totals[champ.handle]) totals[champ.handle].titles += 1;
      }
    }catch(e){}
  }
  allTimeCache = totals;
  return totals;
}

function allTimeTableHtml(totals){
  const rows = Object.entries(totals).sort((a,b) => {
    const pa = a[1].wins/((a[1].wins+a[1].losses)||1), pb = b[1].wins/((b[1].wins+b[1].losses)||1);
    return pb - pa;
  });
  const body = rows.map(([owner, r], i) => {
    const pct = r.wins / ((r.wins + r.losses) || 1);
    const winPct = pct >= 1 ? "1.000" : pct.toFixed(3).replace(/^0/, "");
    return `
    <tr>
      <td class="rank">${i+1}</td>
      <td class="team-cell"><div><div class="team-name">${ownerDisplayName(owner)}</div><div class="team-handle">@${owner}</div></div></td>
      <td class="num">${r.wins}-${r.losses}${r.ties?`-${r.ties}`:""}</td>
      <td class="num">${winPct}</td>
      <td class="num">${r.titles || "—"}</td>
      <td class="num">${Math.round(r.pf).toLocaleString('en-US')}</td>
    </tr>`;
  }).join("");
  return `<table>
    <thead><tr><th></th><th>Owner</th><th class="num">Record</th><th class="num">Win %</th><th class="num">Titles</th><th class="num">Career PF</th></tr></thead>
    <tbody>${body}</tbody>
  </table>`;
}

function allSeasonYears(){
  const sleeperYears = seasons.filter(s => s.status !== "pre_draft" && s.status !== "drafting").map(s => s.season);
  const yahooYears = YAHOO_SEASONS.map(y => y.season).slice().reverse();
  return [...sleeperYears, ...yahooYears];
}

async function getSeasonChampionRunnerUp(year){
  const yahoo = YAHOO_SEASONS.find(y => y.season === year);
  if(yahoo){
    const map = TEAM_OWNER_BY_SEASON[year] || {};
    return {
      champion: yahoo.champion.team, champOwner: map[yahoo.champion.team] || null,
      runnerUp: yahoo.runnerUp || null, runnerUpOwner: yahoo.runnerUp ? (map[yahoo.runnerUp] || null) : null,
    };
  }
  const entry = seasons.find(s => s.season === year);
  if(!entry) return { champion: null, runnerUp: null };
  const data = await loadSeasonCore(entry);
  try{
    const bracket = await getJSON(`${API}/league/${entry.league_id}/winners_bracket`);
    const final = bracket.find(g => g.p === 1 && g.w);
    if(final){
      const champ = data.teams[final.w];
      const runner = data.teams[final.l];
      return {
        champion: champ ? champ.name : null, champOwner: champ ? champ.handle : null,
        runnerUp: runner ? runner.name : null, runnerUpOwner: runner ? runner.handle : null,
      };
    }
  }catch(e){}
  return { champion: null, runnerUp: null };
}

      <div class="trophy-sub">${runnerReal ? (runnerUp || "") : ""}</div>
    </div>

}

async function singleSeasonTableHtml(year){
  const yahoo = YAHOO_SEASONS.find(y => y.season === year);
  if(yahoo){
    const map = TEAM_OWNER_BY_SEASON[year] || {};
    const rows = yahoo.standings.slice().sort((a,b)=> b.w-a.w || (b.pf-b.pa)-(a.pf-a.pa));
    const body = rows.map((s,i) => {
      const owner = map[s.team];

        <td class="num">${s.pf.toFixed(1)}</td>

      </tr>`;
    }).join("");
    return champRunnerUpBlockHtml(yahoo.champion.team, map[yahoo.champion.team], yahoo.runnerUp, yahoo.runnerUp ? map[yahoo.runnerUp] : null) +
      `<p class="sub">Yahoo era</p><table>
      <thead><tr><th></th><th>Team</th><th class="num">Record</th><th class="num">Points For</th><th class="num">Points Against</th></tr></thead>
      <tbody>${body}</tbody></table>`;
  }
  const entry = seasons.find(s => s.season === year);
  const data = await loadSeasonCore(entry);
  const rows = Object.values(data.teams).sort((a,b) =>
    b.wins - a.wins || (b.fpts - b.fpts_against) - (a.fpts - a.fpts_against)
  );
  const started = rows.some(r => r.wins + r.losses + r.ties > 0);
  const { champion, champOwner, runnerUp, runnerUpOwner } = started
    ? await getSeasonChampionRunnerUp(year) : { champion:null, champOwner:null, runnerUp:null, runnerUpOwner:null };
  const body = rows.map((t,i) => `
    <tr>
      <td class="rank">${i+1}</td>
      <td class="team-cell"><div><div class="team-name">${t.name}</div><div class="team-handle">@${t.handle}</div></div></td>
      <td class="num">${t.wins}-${t.losses}${t.ties?`-${t.ties}`:""}</td>
      <td class="num">${t.fpts.toFixed(1)}</td>
      <td class="num">${t.fpts_against.toFixed(1)}</td>
    </tr>`).join("");
  return (started ? champRunnerUpBlockHtml(champion, champOwner, runnerUp, runnerUpOwner) : "") +
    `<p class="sub">${started ? "Live from Sleeper" : "Season hasn't started yet — showing draft-order roster list"}</p><table>
    <thead><tr><th></th><th>Team</th><th class="num">Record</th><th class="num">Points For</th><th class="num">Points Against</th></tr></thead>
    <tbody>${body}</tbody></table>`;
}

function yahooPlayoffBracketHtml(year){
  const b = YAHOO_BRACKETS[year];
  if(!b) return `<div class="state-msg">No bracket data.</div>`;
  const weekKeys = Object.keys(b.weeks).sort((a,b)=>a-b);
  const cols = weekKeys.map((wk,i) => {
    const colLabel = i === weekKeys.length-1 ? "Championship" : `Round ${i+1}`;
    const gamesThisWeek = b.games.filter(g => g[1] === wk);
    const cards = gamesThisWeek.map(([roundLabel, week, teams]) => {
      if(teams.length === 1){
        const [seed, team] = teams[0];
        return `<div class="bracket-card bye-card">
          <div class="bracket-game-label">${roundLabel}</div>
          <div class="bracket-team winner"><span class="seed">${seed}</span><span class="bracket-team-name">${team}</span></div>
          <div class="bracket-team bye-slot"><span class="seed"></span><span class="bracket-team-name">BYE</span></div>
        </div>`;
      }
      const [[s1,t1,sc1],[s2,t2,sc2]] = teams;
      const t1Win = sc1 > sc2;
      return `<div class="bracket-card">
        <div class="bracket-game-label">${roundLabel}</div>
        <div class="bracket-team ${t1Win?'winner':''}"><span class="seed">${s1}</span><span class="bracket-team-name">${t1}</span><span class="num">${sc1.toFixed(1)}</span></div>
        <div class="bracket-team ${!t1Win?'winner':''}"><span class="seed">${s2}</span><span class="bracket-team-name">${t2}</span><span class="num">${sc2.toFixed(1)}</span></div>
      </div>`;
    }).join("");
    return `<div class="bracket-col"><div class="bracket-col-label">${colLabel} · Wk ${wk}</div><div class="bracket-col-games">${cards}</div></div>`;
  }).join("");
  return `<div class="bracket-wrap">${cols}</div>`;
}

async function sleeperPlayoffBracketHtml(year){
  const entry = seasons.find(s => s.season === year);
  const data = await loadSeasonCore(entry);
  let bracket;
  try{ bracket = await getJSON(`${API}/league/${entry.league_id}/winners_bracket`); }
  catch(e){ return `<div class="state-msg">No bracket data.</div>`; }
  if(!bracket || !bracket.length) return `<div class="state-msg">No bracket data yet.</div>`;

  let leagueInfo = null;
  try{ leagueInfo = await getJSON(`${API}/league/${entry.league_id}`); }catch(e){}
  const playoffStartWeek = leagueInfo?.settings?.playoff_week_start || null;

  // Sleeper's bracket API doesn't include seed numbers directly; seeding
  // follows final regular-season standing, same sort used elsewhere.
  const seedOrder = Object.values(data.teams).sort((a,b) =>
    b.wins - a.wins || (b.fpts - b.fpts_against) - (a.fpts - a.fpts_against)
  );
  const seedByRoster = {};
  seedOrder.forEach((t,i) => { seedByRoster[t.roster_id] = i+1; });

  // A team has a bye when it appears in a round after the first WITHOUT a
  // matching t1_from/t2_from key (it didn't earn that slot by winning/losing
  // an earlier game). The bye belongs visually in Round 1 — that's the round
  // they sat out — not the later round where they first actually play.
  const rounds = {};
  bracket.forEach(g => { (rounds[g.r] = rounds[g.r]||[]).push(g); });
  const roundNums = Object.keys(rounds).map(Number).sort((a,b)=>a-b);
  const minRound = roundNums[0];

  const byeTeamIds = [];
  roundNums.filter(r => r > minRound).forEach(r => {
    rounds[r].forEach(g => {
      if(g.t1 != null && !("t1_from" in g)) byeTeamIds.push(g.t1);
      if(g.t2 != null && !("t2_from" in g)) byeTeamIds.push(g.t2);
    });
  });
  byeTeamIds.sort((a,b) => (seedByRoster[a]||99) - (seedByRoster[b]||99));

  const pointsByRound = {};
  if(playoffStartWeek){
    for(const r of roundNums){
      const wk = playoffStartWeek + (r - minRound);
      try{
        const m = await getMatchups(year, wk);
        const map = {};
        (m||[]).forEach(x => { map[x.roster_id] = x.points; });
        pointsByRound[r] = { week: wk, map };
      }catch(e){}
    }
  }

  function gameLabel(g, roundIdx, totalRounds){
    if(g.p === 1) return "Final";
    if(g.p === 3) return "3rd Place Game";
    if(g.p === 5) return "5th Place Game";
    if(g.p === 7) return "7th Place Game";
    if(roundIdx === totalRounds-1) return "Final";
    if(roundIdx === 0) return "Quarterfinal";
    return "Semifinal";
  }

  const cols = roundNums.map((r,i) => {
    const label = i === roundNums.length-1 ? "Championship" : `Round ${i+1}`;
    const wkInfo = pointsByRound[r];
    const isFirstRound = (r === minRound);
    const gamesSorted = rounds[r].slice().sort((a,b) => {
      // Primary: the bracket's own placement field, so the Final (p=1) always
      // sorts before a 3rd/5th place game (p=3/5), even if seed math alone
      // would suggest otherwise (e.g. both bye-seeds losing their semifinal
      // and meeting in the 3rd-place game instead of the final).
      const pa = a.p ?? -1, pb = b.p ?? -1;
      if(pa !== pb) return pa - pb;
      const minA = Math.min(seedByRoster[a.t1]??99, seedByRoster[a.t2]??99);
      const minB = Math.min(seedByRoster[b.t1]??99, seedByRoster[b.t2]??99);
      // Round 1: real games run highest-lower-seed-first (4v5 before 3v6),
      // matching the Yahoo bracket convention. Later rounds: lowest seed first.
      return isFirstRound ? (minB - minA) : (minA - minB);
    });
    function byeCardHtml(tid){
      const t = data.teams[tid];
      return `<div class="bracket-card bye-card">
        <div class="bracket-game-label">Quarterfinal</div>
        <div class="bracket-team winner"><span class="seed">${seedByRoster[tid]||''}</span><span class="bracket-team-name">${t?t.name:'TBD'}</span></div>
        <div class="bracket-team bye-slot"><span class="seed"></span><span class="bracket-team-name">BYE</span></div>
      </div>`;
    }
    const cards = gamesSorted.map(g => {
      const t1 = g.t1 != null ? data.teams[g.t1] : null;
      const t2 = g.t2 != null ? data.teams[g.t2] : null;
      const s1 = g.t1 != null ? seedByRoster[g.t1] : null;
      const s2 = g.t2 != null ? seedByRoster[g.t2] : null;
      const t1Score = (wkInfo && g.t1 != null) ? wkInfo.map[g.t1] : null;
      const t2Score = (wkInfo && g.t2 != null) ? wkInfo.map[g.t2] : null;
      const t1Win = g.w != null && g.w === g.t1;
      const t2Win = g.w != null && g.w === g.t2;
      const lbl = gameLabel(g, i, roundNums.length);
      return `<div class="bracket-card">
        <div class="bracket-game-label">${lbl}</div>
        <div class="bracket-team ${t1Win?'winner':''}"><span class="seed">${s1||''}</span><span class="bracket-team-name">${t1?t1.name:'TBD'}</span>${t1Score!=null?`<span class="num">${t1Score.toFixed(1)}</span>`:""}</div>
        <div class="bracket-team ${t2Win?'winner':''}"><span class="seed">${s2||''}</span><span class="bracket-team-name">${t2?t2.name:'TBD'}</span>${t2Score!=null?`<span class="num">${t2Score.toFixed(1)}</span>`:""}</div>
      </div>`;
    });
    let orderedCards = cards;
    if(isFirstRound && byeTeamIds.length){
      // byeTeamIds is sorted ascending by seed. Lowest seed's bye goes at the
      // very top of the round, highest seed's bye at the very bottom —
      // matching Yahoo's [1-Bye, 4v5, 3v6, 2-Bye] layout.
      const half = Math.ceil(byeTeamIds.length / 2);
      const frontByes = byeTeamIds.slice(0, half).map(byeCardHtml);
      const backByes = byeTeamIds.slice(half).map(byeCardHtml);
      orderedCards = [...frontByes, ...cards, ...backByes];
    }
    return `<div class="bracket-col"><div class="bracket-col-label">${label}${wkInfo?` · Wk ${wkInfo.week}`:""}</div><div class="bracket-col-games">${orderedCards.join("")}</div></div>`;
  }).join("");
  return `<div class="bracket-wrap">${cols}</div>`;
}

let historyOpenYear = null;
async function toggleHistoryDetail(year){
  const el = document.getElementById(`history-detail-${year}`);
  const rowEl = document.querySelector(`.history-season[data-year="${year}"]`);
  if(historyOpenYear === year){
    el.classList.remove("open");
    rowEl.classList.remove("expanded");
    historyOpenYear = null;
    return;
  }
  if(historyOpenYear){
    const prevEl = document.getElementById(`history-detail-${historyOpenYear}`);
    const prevRow = document.querySelector(`.history-season[data-year="${historyOpenYear}"]`);
    if(prevEl){ prevEl.classList.remove("open"); prevEl.innerHTML = ""; }
    if(prevRow) prevRow.classList.remove("expanded");
  }
  historyOpenYear = year;
  rowEl.classList.add("expanded");
  el.classList.add("open");
  el.innerHTML = loadingMsg("Loading standings and bracket…");
  const isYahoo = !!YAHOO_SEASONS.find(y => y.season === year);
  const [standingsHtml, bracketHtml] = await Promise.all([
    singleSeasonTableHtml(year),
    isYahoo ? Promise.resolve(yahooPlayoffBracketHtml(year)) : sleeperPlayoffBracketHtml(year),
  ]);
  el.innerHTML = `
    <div class="history-detail-inner">
      <h3 class="section-h">Playoff Bracket</h3>
      ${bracketHtml}
      <h3 class="section-h" style="margin-top:22px;">Full Season Standings</h3>
      ${standingsHtml}
    </div>`;
}

async function renderHistory(){
  setMain(loadingMsg("Loading season history — this walks every prior season, give it a moment…"));
  try{
    historyOpenYear = null;
    const rowsHtml = [];
    for(const entry of seasons){
      if(entry.status === "pre_draft" || entry.status === "drafting"){
        rowsHtml.push(historyRowHtml(entry.season, {upcoming:true}));
        continue;
      }
      const data = await loadSeasonCore(entry);
      const { champion, champOwner, runnerUp, runnerUpOwner } = await getSeasonChampionRunnerUp(entry.season);
      const rows = Object.values(data.teams).sort((a,b)=>b.wins-a.wins || (b.fpts-b.fpts_against)-(a.fpts-a.fpts_against));
      const best = rows[0];
      const highest = rows.slice().sort((a,b)=>b.fpts-a.fpts)[0];
      rowsHtml.push(historyRowHtml(entry.season, {
        champion, runnerUp,
        champReal: champOwner ? ownerDisplayName(champOwner) : null,
        runnerReal: runnerUpOwner ? ownerDisplayName(runnerUpOwner) : null,
        bestText: best ? `${best.name} (${best.wins}-${best.losses})` : "—",
        highestText: highest ? `${highest.name} — ${highest.fpts.toFixed(1)} pts` : "—",
      }));
    }
    YAHOO_SEASONS.slice().reverse().forEach(y => {
      const map = TEAM_OWNER_BY_SEASON[y.season] || {};
      const champOwner = map[y.champion.team] || null;
      const runnerUpOwner = y.runnerUp ? (map[y.runnerUp] || null) : null;
      const sorted = y.standings.slice().sort((a,b)=> b.w-a.w || (b.pf-b.pa)-(a.pf-a.pa));
      const best = sorted[0];
      const highest = y.standings.slice().sort((a,b)=>b.pf-a.pf)[0];
      rowsHtml.push(historyRowHtml(y.season, {
        champion: y.champion.team, runnerUp: y.runnerUp,
        champReal: champOwner ? ownerDisplayName(champOwner) : null,
        runnerReal: runnerUpOwner ? ownerDisplayName(runnerUpOwner) : null,
        bestText: best ? `${best.team} (${best.w}-${best.l})` : "—",
        highestText: highest ? `${highest.team} — ${highest.pf.toFixed(1)} pts` : "—",
      }));
    });
    setMain(`
      <div class="panel">
        <h2>League History</h2>
        <p class="sub">Click a season to see the full standings and playoff bracket</p>
        ${rowsHtml.join("")}
      </div>`);
    document.querySelectorAll(".history-season.clickable").forEach(el => {
      el.addEventListener("click", () => toggleHistoryDetail(el.dataset.year));
    });
  }catch(e){ setMain(errorMsg("Couldn't load history: " + e.message)); }
}

// ---------- ACHIEVEMENTS ----------
async function renderAchievements(){
  setMain(loadingMsg("Crunching every matchup across league history — this can take a bit…"));
  try{
    let highest = {pts:-1};
    let lowest = {pts:999999};
    let blowout = {margin:-1};
    let closest = {margin:99999};
    let shootout = {total:-1};
    let bestSeasonPF = {pf:-1};
    let bestSeasonRecord = {pct:-1};
    const teamTotals = {}; // handle -> {name, wins, losses, pf}
    const champs = {};     // handle -> count
    const runnerUps = {};  // handle -> count

    function considerSeason(owner, teamLabel, season, wins, losses, pf){
      const pct = wins / (((wins+losses))||1);
      if(pct > bestSeasonRecord.pct) bestSeasonRecord = {pct, team:teamLabel, season, wins, losses};
      if(pf > bestSeasonPF.pf) bestSeasonPF = {pf, team:teamLabel, season};
    }

    for(const entry of seasons){
      if(entry.status === "pre_draft" || entry.status === "drafting") continue;
      const data = await loadSeasonCore(entry);
      Object.values(data.teams).forEach(t => {
        const rec = teamTotals[t.handle] || {name:t.name, handle:t.handle, wins:0, losses:0, pf:0};
        rec.wins += t.wins; rec.losses += t.losses; rec.pf += t.fpts; rec.name = t.name;
        teamTotals[t.handle] = rec;
        considerSeason(t.handle, t.name, entry.season, t.wins, t.losses, t.fpts);
      });
      try{
        const bracket = await getJSON(`${API}/league/${entry.league_id}/winners_bracket`);
        const final = bracket.find(g => g.p === 1 && g.w);
        if(final){
          const champ = data.teams[final.w];
          const runner = data.teams[final.l];
          if(champ) champs[champ.handle] = (champs[champ.handle]||0) + 1;
          if(runner) runnerUps[runner.handle] = (runnerUps[runner.handle]||0) + 1;
        }
      }catch(e){}

      for(let w=1; w<=17; w++){
        let m;
        try{ m = await getMatchups(entry.season, w); }catch(e){ continue; }
        if(!m || !m.length) continue;
        const byId = {};
        m.forEach(x => { if(x.matchup_id!=null) (byId[x.matchup_id]=byId[x.matchup_id]||[]).push(x); });
        Object.values(byId).forEach(pair => {
          pair.forEach(x => {
            const t = data.teams[x.roster_id];
            if(t && x.points > highest.pts) highest = {pts:x.points, team:t.name, season:entry.season, week:w};
            if(t && x.points != null && x.points < lowest.pts) lowest = {pts:x.points, team:t.name, season:entry.season, week:w};
          });
          if(pair.length===2){
            const [a,b] = pair;
            const ta = data.teams[a.roster_id], tb = data.teams[b.roster_id];
            if(ta && tb && a.points!=null && b.points!=null){
              const margin = Math.abs(a.points-b.points);
              const total = a.points + b.points;
              const winner = a.points>b.points?ta:tb, loser=a.points>b.points?tb:ta;
              if(margin > blowout.margin) blowout = {margin, winner:winner.name, loser:loser.name, season:entry.season, week:w};
              if(margin < closest.margin && (a.points>0||b.points>0)) closest = {margin, winner:winner.name, loser:loser.name, season:entry.season, week:w};
              if(total > shootout.total) shootout = {total, teamA:ta.name, teamB:tb.name, ptsA:a.points, ptsB:b.points, season:entry.season, week:w};
            }
          }
        });
      }
    }
    // Fold in Yahoo-era history (2017-2023): records, weekly highs/blowouts, championships
    YAHOO_SEASONS.forEach(y => {
      const map = TEAM_OWNER_BY_SEASON[y.season] || {};
      y.standings.forEach(s => {
        const owner = map[s.team];
        if(!owner) return;
        const rec = teamTotals[owner] || {name:s.team, handle:owner, wins:0, losses:0, pf:0};
        rec.wins += s.w; rec.losses += s.l; rec.pf += s.pf;
        teamTotals[owner] = rec;
        considerSeason(owner, s.team, y.season, s.w, s.l, s.pf);
      });
      const weeks = YAHOO_MATCHUPS[y.season] || {};
      Object.entries(weeks).forEach(([wk, matchups]) => {
        matchups.forEach(m => {
          if(m.actualA > highest.pts) highest = {pts:m.actualA, team:m.teamA, season:y.season, week:wk};
          if(m.actualA < lowest.pts) lowest = {pts:m.actualA, team:m.teamA, season:y.season, week:wk};
          if(m.teamB){
            if(m.actualB > highest.pts) highest = {pts:m.actualB, team:m.teamB, season:y.season, week:wk};
            if(m.actualB < lowest.pts) lowest = {pts:m.actualB, team:m.teamB, season:y.season, week:wk};
            const margin = Math.abs(m.actualA - m.actualB);
            const total = m.actualA + m.actualB;
            const winner = m.actualA > m.actualB ? m.teamA : m.teamB;
            const loser = m.actualA > m.actualB ? m.teamB : m.teamA;
            if(margin > blowout.margin) blowout = {margin, winner, loser, season:y.season, week:wk};
            if(margin < closest.margin && (m.actualA>0||m.actualB>0)) closest = {margin, winner, loser, season:y.season, week:wk};
            if(total > shootout.total) shootout = {total, teamA:m.teamA, teamB:m.teamB, ptsA:m.actualA, ptsB:m.actualB, season:y.season, week:wk};
          }
        });
      });
      const champOwner = YAHOO_MANAGER_TO_OWNER[y.champion.manager];
      if(champOwner) champs[champOwner] = (champs[champOwner]||0) + 1;
      const runnerUpOwner = y.runnerUp ? (map[y.runnerUp] || null) : null;
      if(runnerUpOwner) runnerUps[runnerUpOwner] = (runnerUps[runnerUpOwner]||0) + 1;
    });
    const topChamp = Object.entries(champs).sort((a,b)=>b[1]-a[1])[0];
    const topRunnerUp = Object.entries(runnerUps).sort((a,b)=>b[1]-a[1])[0];
    const topWinPctEntry = Object.entries(teamTotals).sort((a,b)=> (b[1].wins/((b[1].wins+b[1].losses)||1)) - (a[1].wins/((a[1].wins+a[1].losses)||1)))[0];
    const topWinPct = topWinPctEntry ? topWinPctEntry[1] : null;
    const topWinPctOwner = topWinPctEntry ? topWinPctEntry[0] : null;
    const topPFEntry = Object.entries(teamTotals).sort((a,b)=> b[1].pf - a[1].pf)[0];

    const card = (icon, label, value, sub) => `
      <div class="trophy-card">
        <span class="trophy-icon">${icon}</span>
        <div class="trophy-label">${label}</div>
        <div class="trophy-value">${value}</div>
        <div class="trophy-sub">${sub}</div>
      </div>`;

    setMain(`
      <div class="panel">
        <h2>Achievements</h2>
        <p class="sub">Records computed across every completed season on file — Yahoo (2017-2023) and Sleeper (2024-present)</p>

        <div class="trophy-section-title">Scoring Records</div>
        <div class="trophy-grid">
          ${card("🔥","Highest Single-Week Score", highest.pts>=0?highest.pts.toFixed(1):"—", `${highest.team||""} · ${highest.season||""} Wk ${highest.week||""}`)}
          ${card("🧊","Lowest Single-Week Score", lowest.pts<999999?lowest.pts.toFixed(1):"—", `${lowest.team||""} · ${lowest.season||""} Wk ${lowest.week||""}`)}
          ${card("🎯","Highest Combined Score", shootout.total>=0?shootout.total.toFixed(1):"—", shootout.total>=0?`${shootout.teamA} (${shootout.ptsA.toFixed(1)}) vs ${shootout.teamB} (${shootout.ptsB.toFixed(1)}) · ${shootout.season} Wk ${shootout.week}`:"")}
          ${card("⭐","Best Single-Season Points For", bestSeasonPF.pf>=0?bestSeasonPF.pf.toFixed(1):"—", `${bestSeasonPF.team||""} · ${bestSeasonPF.season||""}`)}
          ${card("Σ","Career Points For Leader", topPFEntry?Math.round(topPFEntry[1].pf).toLocaleString('en-US'):"—", topPFEntry?ownerDisplayName(topPFEntry[0]):"")}
        </div>

        <div class="trophy-section-title">Game Records</div>
        <div class="trophy-grid">
          ${card("💥","Biggest Blowout", blowout.margin>=0?blowout.margin.toFixed(1)+" pts":"—", `${blowout.winner||""} over ${blowout.loser||""} · ${blowout.season||""} Wk ${blowout.week||""}`)}
          ${card("🤏","Closest Finish", closest.margin<99999?closest.margin.toFixed(1)+" pts":"—", `${closest.winner||""} over ${closest.loser||""} · ${closest.season||""} Wk ${closest.week||""}`)}
        </div>

        <div class="trophy-section-title">Team Records</div>
        <div class="trophy-grid">
          ${card("🏆","Most Championships", topChamp?topChamp[1]:"—", topChamp?ownerDisplayName(topChamp[0]):"")}
          ${card("🥈","Most Runner-Up Finishes", topRunnerUp?topRunnerUp[1]:"—", topRunnerUp?ownerDisplayName(topRunnerUp[0]):"")}
          ${card("📈","Best All-Time Win %", topWinPct?fmtPct(topWinPct.wins,topWinPct.losses):"—", topWinPct?`${ownerDisplayName(topWinPctOwner)} (${topWinPct.wins}-${topWinPct.losses})`:"")}
          ${card("📊","Best Single-Season Record", bestSeasonRecord.pct>=0?fmtPct(bestSeasonRecord.wins,bestSeasonRecord.losses):"—", bestSeasonRecord.pct>=0?`${bestSeasonRecord.team} (${bestSeasonRecord.wins}-${bestSeasonRecord.losses}) · ${bestSeasonRecord.season}`:"")}
        </div>

  }catch(e){ setMain(errorMsg("Couldn't compute achievements: " + e.message)); }
}

async function getSeasonWeeklySeries(year){
  // Returns { teamLabels: [...], weeks: [1,2,...], series: [{name, data:[...]}] }
  const yahoo = YAHOO_WEEKLY[year];
  if(yahoo){
    const teams = Object.keys(yahoo);
    const maxWeek = Math.max(...teams.map(t => Math.max(...Object.keys(yahoo[t]).map(Number))));
    const weeks = Array.from({length:maxWeek}, (_,i)=>i+1);
    const map = TEAM_OWNER_BY_SEASON[year] || {};
    const series = teams.map(team => ({
      name: team,
      owner: map[team] || null,
      data: weeks.map(w => yahoo[team][String(w)] ?? null),
    }));
    return { weeks, series };
  }
  // Sleeper season - fetch live
  const entry = seasons.find(s => s.season === year);
  const data = await loadSeasonCore(entry);
  const teamsByRoster = data.teams;
  const perTeam = {}; // roster_id -> array indexed by week-1
  const weeks = [];
  for(let w=1; w<=17; w++){
    let m;
    try{ m = await getMatchups(year, w); }catch(e){ break; }
    if(!m || !m.length) break;
    weeks.push(w);
    m.forEach(x => {
      if(!perTeam[x.roster_id]) perTeam[x.roster_id] = [];
      perTeam[x.roster_id][w-1] = (x.points!=null) ? x.points : null;
    });
  }
  const series = Object.keys(perTeam).map(rid => {
    const t = teamsByRoster[rid];
    return { name: t ? t.name : `Team ${rid}`, owner: t ? t.handle : null,
      data: weeks.map(w => perTeam[rid][w-1] ?? null) };
  });
  return { weeks, series };
}

async function getOwnerCareerData(owner){
  const seasonsData = [];

  // Yahoo era
  for(const y of YAHOO_SEASONS){
    const map = TEAM_OWNER_BY_SEASON[y.season] || {};
    const team = Object.keys(map).find(t => map[t] === owner);
    if(!team) continue;
    const row = y.standings.find(s => s.team === team);
    if(!row) continue;
    const champ = YAHOO_MANAGER_TO_OWNER[y.champion.manager] === owner;
    seasonsData.push({ year: y.season, team, wins: row.w, losses: row.l, ties: row.t || 0,
      pf: row.pf, pa: row.pa, champion: champ, source: "yahoo" });
  }

  // Sleeper era
  for(const entry of seasons){
    if(entry.status === "pre_draft" || entry.status === "drafting") continue;
    const data = await loadSeasonCore(entry);
    const t = Object.values(data.teams).find(x => x.handle === owner);
    if(!t) continue;
    let champ = false;
    try{
      const bracket = await getJSON(`${API}/league/${entry.league_id}/winners_bracket`);
      const final = bracket.find(g => g.p === 1 && g.w);
      if(final && data.teams[final.w] && data.teams[final.w].handle === owner) champ = true;
    }catch(e){}
    seasonsData.push({ year: entry.season, team: t.name, wins: t.wins, losses: t.losses,
      ties: t.ties || 0, pf: t.fpts, pa: t.fpts_against, champion: champ, source: "sleeper" });
  }

  seasonsData.sort((a,b) => a.year.localeCompare(b.year));

  const totals = seasonsData.reduce((acc,s) => {
    acc.wins += s.wins; acc.losses += s.losses; acc.ties += s.ties;
    acc.pf += s.pf; acc.pa += s.pa; acc.titles += s.champion ? 1 : 0;
    return acc;
  }, {wins:0, losses:0, ties:0, pf:0, pa:0, titles:0});

  // Weekly bests/worsts across career
  let best = {score:-1}, worst = {score:999999};
  for(const s of seasonsData){
    if(s.source === "yahoo"){
      const wk = (YAHOO_WEEKLY[s.year] && YAHOO_WEEKLY[s.year][s.team]) || {};
      Object.entries(wk).forEach(([w,score]) => {
        if(score == null) return;
        if(score > best.score) best = {score, season:s.year, week:w};
        if(score < worst.score) worst = {score, season:s.year, week:w};
      });
    } else {
      const entry = seasons.find(e => e.season === s.year);
      const data = await loadSeasonCore(entry);
      const t = Object.values(data.teams).find(x => x.handle === owner);
      if(!t) continue;
      for(let w=1; w<=17; w++){
        let m;
        try{ m = await getMatchups(s.year, w); }catch(e){ break; }
        if(!m || !m.length) break;
        const mine = m.find(x => x.roster_id === t.roster_id);
        if(mine && mine.points != null){
          if(mine.points > best.score) best = {score:mine.points, season:s.year, week:w};
          if(mine.points < worst.score) worst = {score:mine.points, season:s.year, week:w};
        }
      }
    }
  }

  return { seasonsData, totals, best, worst };
}

function computeNextYearEligibility(owner){
  const roster = WK18_ROSTERS[owner] || [];
  const keeperMap = {};
  KEEPERS_CURRENT.filter(k => k.owner === owner).forEach(k => keeperMap[k.player] = k);

  return roster.map(p => {
    const asKeeper = keeperMap[p.player];
    if(asKeeper){
      const nextRound = asKeeper.round - 1;
      const underCap = asKeeper.year < 3;
      const aboveFloor = nextRound >= 3; // keeping again can't drop the cost into rounds 1-2
      const eligible = underCap && aboveFloor;
      let reason = "";
      if(!eligible){
        reason = !underCap
          ? "Max 3 consecutive years reached"
          : "Rounds 1-3 never keeper-eligible";
      }
      return {
        player: p.player, pos: p.pos,
        acquired: `Kept (Rd ${asKeeper.round} this year, ${ordYear(asKeeper.year)} yr)`,
        nextRound: eligible ? nextRound : null,
        eligible,
        reason,
      };
    }
    if(p.draftpos === "FA"){
      return { player: p.player, pos: p.pos, acquired: "Free agency pickup",
        nextRound: 9, eligible: true, reason: "" };
    }
    const rd = p.draftpos;
    if(typeof rd === "number" && rd <= 3){
      return { player: p.player, pos: p.pos, acquired: `Drafted Rd ${rd}`,
        nextRound: null, eligible: false, reason: "Rounds 1-3 never keeper-eligible" };
    }
    return { player: p.player, pos: p.pos, acquired: `Drafted Rd ${rd}`,
      nextRound: (typeof rd === "number") ? rd - 1 : null, eligible: true, reason: "" };
  }).sort((a,b) => {
    if(a.eligible !== b.eligible) return a.eligible ? -1 : 1;
    return (a.nextRound ?? 99) - (b.nextRound ?? 99);
  });
}

// ---------- DRAFT RESULTS ----------
async function getDraftBoard(year){
  if(SLEEPER_DRAFT_RESULTS[year]){
    return SLEEPER_DRAFT_RESULTS[year];
  }
  if(YAHOO_DRAFT_RESULTS[year]){
    return YAHOO_DRAFT_RESULTS[year];
  }
  const entry = seasons.find(s => s.season === year);
  if(entry){
    let leagueInfo;
    try{ leagueInfo = await getJSON(`${API}/league/${entry.league_id}`); }catch(e){ return null; }
    const draftId = leagueInfo.draft_id;
    if(!draftId) return null;
    let picks;
    try{ picks = await getJSON(`${API}/draft/${draftId}/picks`); }catch(e){ return null; }
    if(!picks || !picks.length) return null;
    const data = await loadSeasonCore(entry);
    return picks.map(p => {
      const t = data.teams[p.roster_id];
      const meta = p.metadata || {};
      return {
        round: p.round, overall: p.pick_no,
        player: (meta.first_name || meta.last_name) ? `${meta.first_name||""} ${meta.last_name||""}`.trim() : "Unknown",
        pos: meta.position || "", nfl_team: meta.team || "",
        owner: t ? t.handle : (p.picked_by || "?"),
        keeper: !!p.is_keeper,
      };
    });
  }
  return null;
}

  const years = allSeasonYears();
  const defaultYear = seasons.find(s => s.status !== "pre_draft" && s.status !== "drafting")?.season || years[0];

const POS_COLORS = {
  QB: "#B5615C", RB: "#5C9E7C", WR: "#5B7FA6", TE: "#C4A044", DEF: "#8B6B4A", K: "#8577A8"
};

// ---------- DRAFT GRADES (2026 season only — first year we have ADP data for) ----------
function normPlayerName(s){
  return s.toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b\.?/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
}
let ADP_NORM_MAP = null;
function getADP(playerName){
  if(typeof ADP_2026 === "undefined") return null;
  if(ADP_2026[playerName]) return ADP_2026[playerName];
  if(!ADP_NORM_MAP){
    ADP_NORM_MAP = {};
    Object.keys(ADP_2026).forEach(k => { const n = normPlayerName(k); if(!(n in ADP_NORM_MAP)) ADP_NORM_MAP[n] = k; });
  }
  const key = ADP_NORM_MAP[normPlayerName(playerName)];
  return key ? ADP_2026[key] : null;
}

// Positional weight on value-over-ADP: RB/WR carry the most team-building impact,
// QB is easily streamed in a single-QB league, K/DEF are low-stakes and waiver-driven.
const POS_VALUE_WEIGHT = { QB:0.8, RB:1.2, WR:1.1, TE:1.0, K:0.4, DEF:0.4 };
// Penalty per missing roster slot below the "comfortably fieldable" minimum, by position.
const COMPOSITION_PENALTY_WEIGHT = { QB:6, RB:8, WR:7, TE:5, K:2, DEF:2 };
// League settings: 1 QB, 2 RB, 2 WR, 1 TE, 1 RB/WR/TE flex, 1 K, 1 DEF, 0.5 PPR.
const LEAGUE_BASE_STARTERS = { QB:1, RB:2, WR:2, TE:1, K:1, DEF:1 };
const LEAGUE_FLEX_SLOTS = 1;
const LEAGUE_FLEX_ELIGIBLE = ["RB","WR","TE"];
// Bench depth at a diminishing weight — only starter-tier players (including whoever
// wins the flex slot) count at full value. A lone elite starter should outscore two
// mediocre bench players, not lose to them.
const BENCH_WEIGHT = 0.15;

// Classifies every player on a roster (keepers + fresh, combined — that's the real
// team being fielded) as "starter" or "bench" at their position, using ADP-implied
// quality. The single flex slot goes greedily to whichever RB/WR/TE bench player is
// best, matching how a real lineup would actually be set.
function classifyStartersBench(ownerPicks){
  const byPos = {};
  ownerPicks.forEach(p => {
    const adpInfo = getADP(p.player);
    const q = (adpInfo && adpInfo.consensus_adp != null) ? Math.max(0, 300 - adpInfo.consensus_adp) : 50;
    (byPos[p.pos] = byPos[p.pos] || []).push({ pick: p, q });
  });
  const starterSet = new Set();
  ["QB","K","DEF"].forEach(pos => {
    const list = (byPos[pos]||[]).slice().sort((a,b) => b.q - a.q);
    list.slice(0, LEAGUE_BASE_STARTERS[pos]||1).forEach(x => starterSet.add(x.pick));
  });
  const benchCandidates = [];
  LEAGUE_FLEX_ELIGIBLE.forEach(pos => {
    const list = (byPos[pos]||[]).slice().sort((a,b) => b.q - a.q);
    list.slice(0, LEAGUE_BASE_STARTERS[pos]||0).forEach(x => starterSet.add(x.pick));
    list.slice(LEAGUE_BASE_STARTERS[pos]||0).forEach(x => benchCandidates.push(x));
  });
  benchCandidates.sort((a,b) => b.q - a.q);
  benchCandidates.slice(0, LEAGUE_FLEX_SLOTS).forEach(x => starterSet.add(x.pick));
  return starterSet;
}

function computeCompositionPenalty(ownerPicks){
  const posCounts = {};
  ownerPicks.forEach(p => { posCounts[p.pos] = (posCounts[p.pos]||0) + 1; });
  let compositionPenalty = 0;
  const holes = [];
  // Individual per-position minimums: starters + 1 bench backup (TE/K/DEF get no
  // expected backup — TE especially, since carrying one elite starter and streaming
  // is standard, accepted strategy, not a real depth gap).
  const indivMin = {
    QB: LEAGUE_BASE_STARTERS.QB + 1,
    RB: LEAGUE_BASE_STARTERS.RB + 1,
    WR: LEAGUE_BASE_STARTERS.WR + 1,
    TE: LEAGUE_BASE_STARTERS.TE,
    K: LEAGUE_BASE_STARTERS.K,
    DEF: LEAGUE_BASE_STARTERS.DEF,
  };
  Object.entries(indivMin).forEach(([pos, min]) => {
    const have = posCounts[pos] || 0;
    if(have < min){
      const shortfall = min - have;
      compositionPenalty += shortfall * (COMPOSITION_PENALTY_WEIGHT[pos]||3);
      holes.push({pos, have, min, shortfall});
    }
  });
  // Combined flex-pool check: with the flex slot able to come from any of RB/WR/TE,
  // check the RB+WR+TE total against the combined requirement rather than only the
  // individual minimums above (which don't account for the shared flex slot at all).
  const flexPoolMin = LEAGUE_BASE_STARTERS.RB + LEAGUE_BASE_STARTERS.WR + LEAGUE_BASE_STARTERS.TE + LEAGUE_FLEX_SLOTS;
  const flexPoolHave = (posCounts.RB||0) + (posCounts.WR||0) + (posCounts.TE||0);
  if(flexPoolHave < flexPoolMin){
    const shortfall = flexPoolMin - flexPoolHave;
    compositionPenalty += shortfall * 6;
    holes.push({pos:"FLEX", have:flexPoolHave, min:flexPoolMin, shortfall});
  }
  return { compositionPenalty, holes, posCounts };
}

async function computeDraftGrades(year){
  if(typeof ADP_2026 === "undefined" || year !== CURRENT_KEEPER_SEASON) return null;
  const picks = await getDraftBoard(year);
  if(!picks || !picks.length) return null;
  const maxRound = Math.max(...picks.map(p => p.round));

  const byOwner = {};
  picks.forEach(p => (byOwner[p.owner] = byOwner[p.owner]||[]).push(p));

  const results = {};
  Object.entries(byOwner).forEach(([owner, ownerPicks]) => {
    // Starter/bench status uses the FULL roster (keepers + fresh) — that's the real
    // team being fielded — but only fresh picks contribute to the value score, since
    // a keeper's discounted round cost isn't a draft-day decision being graded.
    const starterSet = classifyStartersBench(ownerPicks);

    let rawValue = 0;
    let unknownAdpCount = 0;
    ownerPicks.filter(p => !p.keeper).forEach(p => {
      const adpInfo = getADP(p.player);
      if(!adpInfo || adpInfo.consensus_adp == null){ unknownAdpCount++; return; }
      const value = p.overall - adpInfo.consensus_adp; // positive = value/steal, negative = reach
      const roundWeight = (maxRound - p.round + 1) / maxRound; // earlier rounds weigh more
      const posWeight = POS_VALUE_WEIGHT[p.pos] ?? 1.0;
      const starterWeight = starterSet.has(p) ? 1.0 : BENCH_WEIGHT; // value on a starter matters far more than value on excess depth
      rawValue += value * roundWeight * posWeight * starterWeight;
    });

    const { compositionPenalty, holes, posCounts } = computeCompositionPenalty(ownerPicks);

    results[owner] = { rawValue, compositionPenalty, finalScore: rawValue - compositionPenalty, unknownAdpCount, posCounts, holes };
  });

  // Curve into letter grades with a real spread — not everyone gets an A.
  // 12 tiers with +/- granularity, bucketed by rank percentile so the spread
  // scales naturally with however many teams are in the draft.
  const entries = Object.entries(results).sort((a,b) => b[1].finalScore - a[1].finalScore);
  const n = entries.length;
  const GRADE_TIERS = ["A+","A","A-","B+","B","B-","C+","C","C-","D+","D","F"];
  function gradeForRankFrac(f){
    const idx = Math.min(GRADE_TIERS.length-1, Math.floor(f * GRADE_TIERS.length));
    return GRADE_TIERS[idx];
  }
  entries.forEach(([owner, r], i) => {
    r.grade = gradeForRankFrac(i / n);
    r.rank = i+1;
  });

  return results;
}

// ---------- DRAFT SCORECARD ----------
let draftScorecardOpenOwner = null;
let scorecardChartInstance = null;
const SCORECARD_POSITIONS = ["QB","RB","WR","TE","K","DEF"];

function computePositionalStrength(picks, owners){
  const byOwner = {};
  picks.forEach(p => (byOwner[p.owner] = byOwner[p.owner]||[]).push(p));
  const scoreFor = (owner, pos) => {
    const ownerPicks = byOwner[owner] || [];
    const starterSet = classifyStartersBench(ownerPicks);
    return ownerPicks.filter(p => p.pos === pos).reduce((sum, p) => {
      const adpInfo = getADP(p.player);
      const pts = (adpInfo && adpInfo.consensus_adp != null) ? Math.max(0, 300 - adpInfo.consensus_adp) : 50;
      return sum + pts * (starterSet.has(p) ? 1 : BENCH_WEIGHT);
    }, 0);
  };
  const leagueMax = {};
  SCORECARD_POSITIONS.forEach(pos => {
    leagueMax[pos] = Math.max(1, ...owners.map(o => scoreFor(o, pos)));
  });
  const normalized = {};
  owners.forEach(o => {
    normalized[o] = {};
    SCORECARD_POSITIONS.forEach(pos => {
      normalized[o][pos] = Math.round((scoreFor(o, pos) / leagueMax[pos]) * 100);
    });
  });
  const leagueAvg = {};
  SCORECARD_POSITIONS.forEach(pos => {
    leagueAvg[pos] = Math.round(owners.reduce((s,o) => s + normalized[o][pos], 0) / owners.length);
  });
  return { normalized, leagueAvg };
}

function renderDraftScorecard(owner, picks, grades, strengthData){
  const panel = document.getElementById("draftScorecardPanel");
  document.querySelectorAll(".draft-col-header.active-tab").forEach(el => el.classList.remove("active-tab"));
  if(draftScorecardOpenOwner === owner){
    panel.innerHTML = "";
    panel.classList.remove("open");
    draftScorecardOpenOwner = null;
    if(scorecardChartInstance){ scorecardChartInstance.destroy(); scorecardChartInstance = null; }
    return;
  }
  draftScorecardOpenOwner = owner;

  const headerEl = document.querySelector(`.draft-col-header[data-owner="${owner}"]`);
  const gridHeaderEl = document.querySelector(".draft-grid-header");
  if(headerEl){
    headerEl.classList.add("active-tab");
    const headerRect = headerEl.getBoundingClientRect();
    const gridRect = gridHeaderEl.getBoundingClientRect();
    panel.style.setProperty("--tab-left", (headerRect.left - gridRect.left) + "px");
    panel.style.setProperty("--tab-width", headerRect.width + "px");
  }
  panel.classList.add("open");

  const ownerPicks = picks.filter(p => p.owner === owner).slice().sort((a,b) => a.round - b.round);
  const g = grades && grades[owner];
  const gradeCls = g ? "grade-" + g.grade.replace("+","plus").replace("-","minus") : "";

  const rows = ownerPicks.map(p => {
    const adpInfo = getADP(p.player);
    const adpVal = (adpInfo && adpInfo.consensus_adp != null) ? adpInfo.consensus_adp : null;
    const delta = adpVal != null ? (p.overall - adpVal) : null;
    const deltaLabel = delta == null ? "—" : (delta > 0 ? `+${delta.toFixed(0)}` : `${delta.toFixed(0)}`);
    const deltaColor = delta == null ? "var(--ink-dim)" : (delta > 0 ? "var(--win)" : "var(--loss)");
    return `<tr class="${p.keeper?'keeper-pick-row':''}">
      <td class="num">Rd ${p.round}</td>
      <td class="num">#${p.overall}</td>
      <td>${p.player}${p.keeper?' <span class="year-tag" style="margin-left:4px;">K</span>':''}</td>
      <td>${p.pos||"—"}</td>
      <td class="num">${adpVal!=null?adpVal.toFixed(1):"—"}</td>
      <td class="num" style="color:${deltaColor};">${deltaLabel}</td>
    </tr>`;
  }).join("");

  panel.innerHTML = `
    <div class="team-block">
      <h3>${ownerDisplayName(owner)} <span class="handle">@${owner}</span>${g?` <span class="draft-grade ${gradeCls}" style="display:inline-flex; margin-left:8px; vertical-align:middle;">${g.grade}</span>`:""}</h3>
      ${g?`<p class="sub">Rank ${g.rank} of ${Object.keys(grades).length} this draft · value score ${g.rawValue.toFixed(1)} · composition penalty -${g.compositionPenalty.toFixed(1)}${g.holes.length?` · thin at ${g.holes.map(h=>h.pos).join('/')}`:""}</p>`:""}
      <div class="scorecard-grid">
        <div>
          <p class="sub" style="margin:0 0 8px;">Full Draft</p>
          <table>
            <thead><tr><th class="num">Rd</th><th class="num">Pick</th><th>Player</th><th>Pos</th><th class="num">ADP</th><th class="num">vs. ADP</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div>
          <p class="sub" style="margin:0 0 8px;">Positional Strength (vs. league)</p>
          <div style="position:relative; height:300px;"><canvas id="scorecardRadar"></canvas></div>
        </div>
      </div>
    </div>`;

  if(scorecardChartInstance){ scorecardChartInstance.destroy(); scorecardChartInstance = null; }
  const ctx = document.getElementById("scorecardRadar");
  scorecardChartInstance = new Chart(ctx, {
    type: "radar",
    data: {
      labels: SCORECARD_POSITIONS,
      datasets: [
        {
          label: ownerDisplayName(owner),
          data: SCORECARD_POSITIONS.map(pos => strengthData.normalized[owner][pos]),
          backgroundColor: "rgba(242,194,48,.25)",
          borderColor: "#F2C230",
          pointBackgroundColor: "#F2C230",
        },
        {
          label: "League Average",
          data: SCORECARD_POSITIONS.map(pos => strengthData.leagueAvg[pos]),
          backgroundColor: "rgba(159,178,201,.10)",
          borderColor: "#9FB2C9",
          pointBackgroundColor: "#9FB2C9",
          borderDash: [4,3],
        },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        r: {
          min: 0, max: 100,
          ticks: { color: "#9CAB9E", backdropColor: "transparent" },
          grid: { color: "#1E2E23" },
          angleLines: { color: "#1E2E23" },
          pointLabels: { color: "#EDEDE4", font: { family: "IBM Plex Mono", size: 11 } },
        },
      },
      plugins: { legend: { labels: { color: "#9CAB9E" } } },
    },
  });
  panel.scrollIntoView({behavior:"smooth", block:"nearest"});
}

async function renderDraftBoardBody(year){
  const body = document.getElementById("draftBoardBody");
  body.innerHTML = loadingMsg("Loading draft board…");
  try{
    const picks = await getDraftBoard(year);
    if(!picks || !picks.length){
      body.innerHTML = `<div class="state-msg">No draft data available for ${year} yet.</div>`;
      return;
    }
    const hasPositions = picks.some(p => p.pos);
    const round1 = picks.filter(p => p.round === 1).sort((a,b) => a.overall - b.overall);
    const slots = round1.map(p => p.owner);
    const numTeams = slots.length;
    const maxRound = Math.max(...picks.map(p => p.round));

    const byRoundOwner = {};
    picks.forEach(p => {
      byRoundOwner[p.round] = byRoundOwner[p.round] || {};
      byRoundOwner[p.round][p.owner] = p;
    });

    const grades = await computeDraftGrades(year);
    const clickable = !!grades;
    const entry = seasons.find(s => s.season === year);
    const headerCells = slots.map(owner => {
      const g = grades && grades[owner];
      const gradeCls = g ? "grade-" + g.grade.replace("+","plus").replace("-","minus") : "";
      return `<div class="draft-col-header${clickable?' clickable':''}" data-owner="${owner}">${ownerDisplayName(owner)}${g ? `<span class="draft-grade ${gradeCls}" title="Value score ${g.rawValue.toFixed(1)}, composition penalty -${g.compositionPenalty.toFixed(1)}${g.holes.length?', roster holes: '+g.holes.map(h=>h.pos).join('/'):''}">${g.grade}</span>` : ""}</div>`;
    }).join("");
    const strengthData = grades ? computePositionalStrength(picks, slots) : null;

    let rowsHtml = "";
    for(let r=1; r<=maxRound; r++){
      const cells = slots.map(owner => {
        const p = (byRoundOwner[r]||{})[owner];
        if(!p) return `<div class="draft-cell draft-cell-empty"></div>`;
        const color = POS_COLORS[p.pos] || "#3A4B5C";
        return `<div class="draft-cell ${p.keeper?'draft-cell-keeper':''}" style="background:${color};" title="${p.player}${p.pos?' ('+p.pos+')':''}${p.nfl_team?' - '+p.nfl_team:''}">
          <div class="draft-cell-pick">#${p.overall}${p.keeper?' · K':''}</div>
          <div class="draft-cell-player">${p.player}</div>
          <div class="draft-cell-pos">${p.pos||""}${p.nfl_team?" · "+p.nfl_team:""}</div>
        </div>`;
      }).join("");
      rowsHtml += `<div class="draft-row"><div class="draft-row-label">R${r}</div>${cells}</div>`;
    }

    body.innerHTML = `
      ${hasPositions ? "" : `<div class="state-msg" style="padding:8px 0 16px; text-align:left; font-size:12px;">Position data (and therefore cell coloring) isn't available for this season yet — cells show as neutral gray.</div>`}
      <div class="draft-scroll-top" id="draftScrollTop"><div class="draft-scroll-top-inner" id="draftScrollTopInner"></div></div>
      <div class="draft-grid-wrap" id="draftGridWrap">
        <div class="draft-grid-header" style="--num-teams:${numTeams};">
          <div class="draft-row-label"></div>${headerCells}
        </div>
        <div id="draftScorecardPanel"></div>
        <div style="--num-teams:${numTeams};">${rowsHtml}</div>
      </div>
      <div class="draft-legend">
        ${Object.entries(POS_COLORS).map(([pos,color]) => `<span class="draft-legend-item"><span class="draft-legend-swatch" style="background:${color};"></span>${pos}</span>`).join("")}
        <span class="draft-legend-item"><span class="draft-legend-swatch" style="background:#3A4B5C;"></span>Unknown</span>
        <span class="draft-legend-item"><span class="draft-legend-swatch" style="border:2px solid var(--gold); background:transparent;"></span>Keeper (K)</span>
      </div>`;

    // Mirror a thin scrollbar above the grid, synced both ways with the real one.
    const scrollTop = document.getElementById("draftScrollTop");
    const scrollTopInner = document.getElementById("draftScrollTopInner");
    const gridWrap = document.getElementById("draftGridWrap");
    scrollTopInner.style.width = gridWrap.scrollWidth + "px";
    let syncing = false;
    scrollTop.addEventListener("scroll", () => {
      if(syncing) return; syncing = true;
      gridWrap.scrollLeft = scrollTop.scrollLeft;
      syncing = false;
    });
    gridWrap.addEventListener("scroll", () => {
      if(syncing) return; syncing = true;
      scrollTop.scrollLeft = gridWrap.scrollLeft;
      syncing = false;
    });

    if(clickable){
      draftScorecardOpenOwner = null;
      document.querySelectorAll(".draft-col-header.clickable").forEach(el => {
        el.addEventListener("click", () => {
          renderDraftScorecard(el.dataset.owner, picks, grades, strengthData);
        });
      });
    }
  }catch(e){ body.innerHTML = `<div class="state-msg error">Couldn't load draft board: ${e.message}</div>`; }
}

  try{
    seasons = await buildSeasonChain(STARTING_LEAGUE_ID);

    // pick default season: most recent with actual games, else most recent
    activeSeason = seasons.find(s => s.status !== "pre_draft" && s.status !== "drafting")?.season || seasons[0].season;

    renderActive();
  }catch(e){
    setMain(errorMsg("Couldn't connect to Sleeper for league " + STARTING_LEAGUE_ID + ": " + e.message +
      ". Double-check the league ID and that this league is public/accessible."));
  }
}
