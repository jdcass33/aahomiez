<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAHomiez — League Portal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

:root{
  --field:#00193A;
  --field-line:#0E2E52;
  --panel:#0A2A4D;
  --panel-2:#0F3661;
  --ink:#EDEDE4;
  --ink-dim:#9FB2C9;
  --gold:#F2C230;
  --win:#4C8C5A;
  --loss:#B4483A;
  --hair:#1B4470;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--field);
  color:var(--ink);
  font-family:'IBM Plex Sans',sans-serif;
  min-height:100vh;
}
.yard-lines{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image: repeating-linear-gradient(90deg, transparent, transparent 79px, var(--field-line) 79px, var(--field-line) 80px);
  opacity:.5;
}
.wrap{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:0 24px 80px;}

header{padding:36px 0 20px; border-bottom:1px solid var(--hair);}
.eyebrow-row{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;}
h1{
  font-family:'Oswald',sans-serif; font-weight:700; text-transform:uppercase;
  letter-spacing:.5px; font-size:42px; margin:0; color:var(--ink);
}
h1 span{color:var(--gold);}
.league-meta{font-size:13px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace;}
.season-picker{display:flex; align-items:center; gap:10px; margin-top:14px;}
.season-picker select{
  background:var(--panel); border:1px solid var(--hair); color:var(--ink);
  font-family:'IBM Plex Mono',monospace; font-size:13px; padding:7px 10px; border-radius:3px;
}

nav{display:flex; gap:2px; margin-top:22px; flex-wrap:wrap;}
nav button{
  background:none; border:none; color:var(--ink-dim); font-family:'Oswald',sans-serif;
  font-size:15px; text-transform:uppercase; letter-spacing:.4px; padding:10px 18px;
  cursor:pointer; border-bottom:3px solid transparent; transition:color .15s, border-color .15s;
}
nav button:hover{color:var(--ink);}
nav button.active{color:var(--gold); border-bottom-color:var(--gold);}

main{padding-top:28px;}
.panel{background:var(--panel); border:1px solid var(--hair); border-radius:4px; padding:22px; margin-bottom:20px;}
.standings-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start;}
@media (max-width: 820px){ .standings-grid{grid-template-columns:1fr;} }
.section-h{font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:16px; margin:0 0 10px; letter-spacing:.3px;}
.keepers-grid{display:grid; grid-template-columns:1fr 1.3fr; gap:24px; align-items:start;}
@media (max-width: 820px){ .keepers-grid{grid-template-columns:1fr;} }
.ineligible-row td{opacity:.55;}
.season-group-row td{background:var(--panel-2); font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--gold); font-weight:600; padding:6px 10px;}
.panel h2{font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:20px; margin:0 0 4px; letter-spacing:.3px;}
.panel .sub{color:var(--ink-dim); font-size:13px; margin:0 0 18px;}

table{width:100%; border-collapse:collapse; font-size:14px;}
th{
  text-align:left; font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;
  letter-spacing:.06em; color:var(--ink-dim); font-weight:500; padding:8px 10px; border-bottom:1px solid var(--hair);
}
td{padding:10px; border-bottom:1px solid var(--field-line);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
td.num, th.num{text-align:right; font-family:'IBM Plex Mono',monospace;}
.rank{color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; width:28px;}
.team-cell{display:flex; align-items:center; gap:10px;}
.team-name{font-weight:600;}
.team-handle{color:var(--ink-dim); font-size:12px; font-family:'IBM Plex Mono',monospace;}
.win-pill, .loss-pill{
  display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; padding:2px 7px; border-radius:2px;
}
.win-pill{background:rgba(76,140,90,.18); color:var(--win);}
.loss-pill{background:rgba(180,72,58,.18); color:var(--loss);}

.matchup-row{display:grid; grid-template-columns:1fr 70px 20px 70px 1fr; align-items:center; padding:14px 10px; border-bottom:1px solid var(--field-line); gap:8px;}
.matchup-row:last-child{border-bottom:none;}
.mt-team{font-weight:600; font-size:14px;}
.mt-team.right{text-align:right;}
.mt-score{font-family:'Oswald',sans-serif; font-size:22px; text-align:center;}
.mt-score.win{color:var(--gold);}
.mt-vs{text-align:center; color:var(--ink-dim); font-size:11px; font-family:'IBM Plex Mono',monospace;}

.week-picker{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:18px;}
.week-picker button{
  background:var(--panel-2); border:1px solid var(--hair); color:var(--ink-dim);
  font-family:'IBM Plex Mono',monospace; font-size:12px; padding:5px 10px; border-radius:2px; cursor:pointer;
}
.week-picker button.active{background:var(--gold); color:#1a1509; border-color:var(--gold); font-weight:600;}

.trophy-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px;}
.trophy-card{background:var(--panel-2); border:1px solid var(--hair); border-radius:4px; padding:16px;}
.trophy-label{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; color:var(--gold); letter-spacing:.05em; margin-bottom:6px;}
.trophy-value{font-family:'Oswald',sans-serif; font-size:24px; margin-bottom:2px;}
.trophy-sub{color:var(--ink-dim); font-size:12px;}

.history-season{display:flex; align-items:center; gap:16px; padding:12px 10px; border-bottom:1px solid var(--field-line); flex-wrap:wrap;}
.history-season:last-child{border-bottom:none;}
.history-year{font-family:'Oswald',sans-serif; font-size:20px; width:80px; color:var(--gold);}
.history-champ{flex:1; min-width:120px;}
.history-champ .label{font-size:11px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; text-transform:uppercase;}
.history-champ .val{font-weight:600;}
.history-sub{font-size:11px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace;}
.history-season.clickable{cursor:pointer; transition:background .15s;}
.history-season.clickable:hover{background:rgba(255,255,255,.03);}
.history-season .chevron{display:inline-block; font-size:13px; color:var(--ink-dim); transition:transform .15s; margin-left:2px;}
.history-season.expanded .chevron{transform:rotate(90deg); color:var(--gold);}
.history-season.expanded{background:rgba(255,255,255,.03);}
.history-detail{max-height:0; overflow:hidden; transition:max-height .2s ease;}
.history-detail.open{max-height:3000px;}
.history-detail-inner{padding:18px 10px 26px; border-bottom:1px solid var(--field-line);}
.champ-strip{display:flex; gap:12px; margin-bottom:16px;}
.champ-card{flex:1; margin-bottom:0;}
.champ-card.gold-card{border-left:3px solid var(--gold);}
.champ-card.silver-card{border-left:3px solid var(--ink-dim);}
.bracket-wrap{display:flex; align-items:stretch; gap:0; overflow-x:auto; padding-bottom:6px;}
.bracket-col{min-width:190px; flex:1; padding-right:20px; margin-right:20px; border-right:2px solid var(--hair); position:relative;}
.bracket-col:last-child{border-right:none; margin-right:0; padding-right:0;}
.bracket-col::after{content:'▸'; position:absolute; right:5px; top:50%; transform:translateY(-50%); color:var(--hair); font-size:18px;}
.bracket-col:last-child::after{content:'';}
.bracket-col-label{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; color:var(--ink-dim); margin-bottom:10px; letter-spacing:.05em;}
.bracket-col-games{display:flex; flex-direction:column; justify-content:space-around; height:calc(100% - 24px); gap:14px;}
.bracket-card{background:var(--panel-2); border:1px solid var(--hair); border-radius:4px; overflow:hidden;}
.bracket-card.bye-card{opacity:.85;}
.bracket-game-label{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-dim); background:rgba(255,255,255,.03); padding:5px 10px; border-bottom:1px solid var(--hair);}
.bracket-team{display:flex; align-items:center; gap:8px; padding:8px 10px; font-size:13px; border-bottom:1px solid var(--hair);}
.bracket-team:last-child{border-bottom:none;}
.bracket-team.winner{color:var(--gold); font-weight:600;}
.bracket-team.bye-slot{color:var(--ink-dim); font-style:italic; font-size:11px; text-transform:uppercase; letter-spacing:.05em;}
.bracket-team-name{flex:1;}
.seed{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-dim); background:var(--field); border:1px solid var(--hair); border-radius:2px; padding:1px 5px; min-width:14px; text-align:center; flex-shrink:0;}
.bracket-team.winner .seed{color:var(--gold); border-color:var(--gold);}

.team-block{margin-bottom:26px;}
.team-block h3{
  font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:16px; margin:0 0 8px;
  padding-bottom:8px; border-bottom:1px solid var(--hair); display:flex; justify-content:space-between; align-items:baseline;
}
.team-block h3 .handle{font-size:12px; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; text-transform:none;}
.year-tag{font-family:'IBM Plex Mono',monospace; font-size:11px; padding:2px 7px; border-radius:2px; background:rgba(242,194,48,.15); color:var(--gold);}
.year-tag.first{background:rgba(76,140,90,.15); color:var(--win);}
.year-tag.maxed{background:rgba(180,72,58,.18); color:var(--loss);}

.state-msg{color:var(--ink-dim); font-size:14px; padding:30px 0; text-align:center; font-family:'IBM Plex Mono',monospace;}
.state-msg.error{color:var(--loss);}
.spinner{
  display:inline-block; width:14px; height:14px; border:2px solid var(--hair); border-top-color:var(--gold);
  border-radius:50%; animation:spin .7s linear infinite; margin-right:8px; vertical-align:-2px;
}
@keyframes spin{to{transform:rotate(360deg);}}
footer{color:var(--ink-dim); font-size:12px; text-align:center; padding:30px 0 10px; font-family:'IBM Plex Mono',monospace;}
</style>

let seasons = [];        // [{league_id, season, status}], most recent first
let seasonData = {};     // season(year str) -> {league, rosters, users, teams:{roster_id:{name,handle,owner_id}}}
let matchupCache = {};   // `${season}-${week}` -> matchups array
let activeTab = "standings";
let activeSeason = null;
let activeWeek = 1;

async function getJSON(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error(`Sleeper API ${res.status} on ${url}`);
  return res.json();
}

function ordYear(n){ return n===1?"1st":n===2?"2nd":n===3?"3rd":n+"th"; }

async function buildSeasonChain(startId){
  let id = startId;
  let guard = 0;
  const chain = [];
  while(id && id !== "0" && guard < 25){
    guard++;
    const lg = await getJSON(`${API}/league/${id}`);
    chain.push({league_id:id, season: lg.season, status: lg.status, prev: lg.previous_league_id, name: lg.name});
    id = lg.previous_league_id;
  }
  return chain; // most recent first
}

async function loadSeasonCore(entry){
  const y = entry.season;
  if(seasonData[y]) return seasonData[y];
  const [rosters, users] = await Promise.all([
    getJSON(`${API}/league/${entry.league_id}/rosters`),
    getJSON(`${API}/league/${entry.league_id}/users`)
  ]);
  const userMap = {};
  users.forEach(u => userMap[u.user_id] = u);
  const teams = {};
  rosters.forEach(r => {
    const u = userMap[r.owner_id] || {};
    teams[r.roster_id] = {
      roster_id: r.roster_id,
      owner_id: r.owner_id,
      handle: u.username || u.display_name || "unknown",
      name: (u.metadata && u.metadata.team_name) || u.display_name || "Team " + r.roster_id,
      wins: r.settings?.wins ?? 0,
      losses: r.settings?.losses ?? 0,
      ties: r.settings?.ties ?? 0,
      fpts: (r.settings?.fpts ?? 0) + (r.settings?.fpts_decimal ?? 0)/100,
      fpts_against: (r.settings?.fpts_against ?? 0) + (r.settings?.fpts_against_decimal ?? 0)/100,
    };
  });
  seasonData[y] = { entry, rosters, users, teams };
  return seasonData[y];
}

async function getMatchups(season, week){
  const key = `${season}-${week}`;
  if(matchupCache[key]) return matchupCache[key];
  const entry = seasons.find(s => s.season === season);
  const m = await getJSON(`${API}/league/${entry.league_id}/matchups/${week}`);
  matchupCache[key] = m;
  return m;
}

let allTimeCache = null;

function getOwnerRecordForYahooSeason(y, owner){
  for(const s of y.standings){
    if(TEAM_OWNER_BY_SEASON[y.season] && TEAM_OWNER_BY_SEASON[y.season][s.team] === owner) return s;
  }
  return null;
}

async function computeAllTimeStandings(){
  if(allTimeCache) return allTimeCache;
  const totals = {}; // owner -> {wins,losses,ties,pf,pa,titles}
  const bump = (owner, w,l,t,pf,pa) => {
    const rec = totals[owner] || {wins:0,losses:0,ties:0,pf:0,pa:0,titles:0};
    rec.wins+=w; rec.losses+=l; rec.ties+=t||0; rec.pf+=pf; rec.pa+=pa;
    totals[owner]=rec;
  };
  // Yahoo era
  YAHOO_SEASONS.forEach(y => {
    const map = TEAM_OWNER_BY_SEASON[y.season] || {};
    y.standings.forEach(s => {
      const owner = map[s.team];
      if(owner) bump(owner, s.w, s.l, s.t, s.pf, s.pa);
    });
    const champOwner = YAHOO_MANAGER_TO_OWNER[y.champion.manager];
    if(champOwner) (totals[champOwner]||bump(champOwner,0,0,0,0,0)) && (totals[champOwner].titles += 1);
  });
  // Sleeper era
  for(const entry of seasons){
    if(entry.status === "pre_draft" || entry.status === "drafting") continue;
    const data = await loadSeasonCore(entry);
    Object.values(data.teams).forEach(t => bump(t.handle, t.wins, t.losses, t.ties||0, t.fpts, t.fpts_against));
    try{
      const bracket = await getJSON(`${API}/league/${entry.league_id}/winners_bracket`);
      const final = bracket.find(g => g.p === 1 && g.w);
      if(final){
        const champ = data.teams[final.w];
        if(champ && totals[champ.handle]) totals[champ.handle].titles += 1;
      }
    }catch(e){}
  }
  allTimeCache = totals;
  return totals;
}

function allTimeTableHtml(totals){
  const rows = Object.entries(totals).sort((a,b) => {
    const pa = a[1].wins/((a[1].wins+a[1].losses)||1), pb = b[1].wins/((b[1].wins+b[1].losses)||1);
    return pb - pa;
  });
  const body = rows.map(([owner, r], i) => {
    const pct = r.wins / ((r.wins + r.losses) || 1);
    const winPct = pct >= 1 ? "1.000" : pct.toFixed(3).replace(/^0/, "");
    return `
    <tr>
      <td class="rank">${i+1}</td>
      <td class="team-cell"><div><div class="team-name">${ownerDisplayName(owner)}</div><div class="team-handle">@${owner}</div></div></td>
      <td class="num">${r.wins}-${r.losses}${r.ties?`-${r.ties}`:""}</td>
      <td class="num">${winPct}</td>
      <td class="num">${r.titles || "—"}</td>
      <td class="num">${Math.round(r.pf).toLocaleString('en-US')}</td>
    </tr>`;
  }).join("");
  return `<table>
    <thead><tr><th></th><th>Owner</th><th class="num">Record</th><th class="num">Win %</th><th class="num">Titles</th><th class="num">Career PF</th></tr></thead>
    <tbody>${body}</tbody>
  </table>`;
}

function allSeasonYears(){
  const sleeperYears = seasons.filter(s => s.status !== "pre_draft" && s.status !== "drafting").map(s => s.season);
  const yahooYears = YAHOO_SEASONS.map(y => y.season).slice().reverse();
  return [...sleeperYears, ...yahooYears];
}

async function getSeasonChampionRunnerUp(year){
  const yahoo = YAHOO_SEASONS.find(y => y.season === year);
  if(yahoo){
    const map = TEAM_OWNER_BY_SEASON[year] || {};
    return {
      champion: yahoo.champion.team, champOwner: map[yahoo.champion.team] || null,
      runnerUp: yahoo.runnerUp || null, runnerUpOwner: yahoo.runnerUp ? (map[yahoo.runnerUp] || null) : null,
    };
  }
  const entry = seasons.find(s => s.season === year);
  if(!entry) return { champion: null, runnerUp: null };
  const data = await loadSeasonCore(entry);
  try{
    const bracket = await getJSON(`${API}/league/${entry.league_id}/winners_bracket`);
    const final = bracket.find(g => g.p === 1 && g.w);
    if(final){
      const champ = data.teams[final.w];
      const runner = data.teams[final.l];
      return {
        champion: champ ? champ.name : null, champOwner: champ ? champ.handle : null,
        runnerUp: runner ? runner.name : null, runnerUpOwner: runner ? runner.handle : null,
      };
    }
  }catch(e){}
  return { champion: null, runnerUp: null };
}

function champRunnerUpBlockHtml(champion, champOwner, runnerUp, runnerUpOwner){
  const champReal = champOwner ? ownerDisplayName(champOwner) : null;
  const runnerReal = runnerUpOwner ? ownerDisplayName(runnerUpOwner) : null;
  return `<div class="champ-strip">
    <div class="trophy-card champ-card gold-card">
      <div class="trophy-label">🥇 Champion</div>
      <div class="trophy-value">${champReal || champion || "—"}</div>
      <div class="trophy-sub">${champReal ? (champion || "") : ""}</div>
    </div>
    <div class="trophy-card champ-card silver-card">
      <div class="trophy-label">🥈 Runner-Up</div>
      <div class="trophy-value">${runnerReal || runnerUp || "—"}</div>
      <div class="trophy-sub">${runnerReal ? (runnerUp || "") : ""}</div>
    </div>
  </div>`;
}

async function singleSeasonTableHtml(year){
  const yahoo = YAHOO_SEASONS.find(y => y.season === year);
  if(yahoo){
    const map = TEAM_OWNER_BY_SEASON[year] || {};
    const rows = yahoo.standings.slice().sort((a,b)=> b.w-a.w || (b.pf-b.pa)-(a.pf-a.pa));
    const body = rows.map((s,i) => {
      const owner = map[s.team];
      return `<tr>
        <td class="rank">${i+1}</td>
        <td class="team-cell"><div><div class="team-name">${s.team}</div><div class="team-handle">${owner?ownerDisplayName(owner):""}</div></div></td>
        <td class="num">${s.w}-${s.l}${s.t?`-${s.t}`:""}</td>
        <td class="num">${s.pf.toFixed(1)}</td>
        <td class="num">${s.pa.toFixed(1)}</td>
      </tr>`;
    }).join("");
    return champRunnerUpBlockHtml(yahoo.champion.team, map[yahoo.champion.team], yahoo.runnerUp, yahoo.runnerUp ? map[yahoo.runnerUp] : null) +
      `<p class="sub">Yahoo era</p><table>
      <thead><tr><th></th><th>Team</th><th class="num">Record</th><th class="num">Points For</th><th class="num">Points Against</th></tr></thead>
      <tbody>${body}</tbody></table>`;
  }
  const entry = seasons.find(s => s.season === year);
  const data = await loadSeasonCore(entry);
  const rows = Object.values(data.teams).sort((a,b) =>
    b.wins - a.wins || (b.fpts - b.fpts_against) - (a.fpts - a.fpts_against)
  );
  const started = rows.some(r => r.wins + r.losses + r.ties > 0);
  const { champion, champOwner, runnerUp, runnerUpOwner } = started
    ? await getSeasonChampionRunnerUp(year) : { champion:null, champOwner:null, runnerUp:null, runnerUpOwner:null };
  const body = rows.map((t,i) => `
    <tr>
      <td class="rank">${i+1}</td>
      <td class="team-cell"><div><div class="team-name">${t.name}</div><div class="team-handle">@${t.handle}</div></div></td>
      <td class="num">${t.wins}-${t.losses}${t.ties?`-${t.ties}`:""}</td>
      <td class="num">${t.fpts.toFixed(1)}</td>
      <td class="num">${t.fpts_against.toFixed(1)}</td>
    </tr>`).join("");
  return (started ? champRunnerUpBlockHtml(champion, champOwner, runnerUp, runnerUpOwner) : "") +
    `<p class="sub">${started ? "Live from Sleeper" : "Season hasn't started yet — showing draft-order roster list"}</p><table>
    <thead><tr><th></th><th>Team</th><th class="num">Record</th><th class="num">Points For</th><th class="num">Points Against</th></tr></thead>
    <tbody>${body}</tbody></table>`;
}

async function renderStandings(){
  setMain(loadingMsg("Loading standings — computing all-time totals across every season…"));
  try{
    const totals = await computeAllTimeStandings();
    const years = allSeasonYears();
    const defaultYear = seasons.find(s => s.status !== "pre_draft" && s.status !== "drafting")?.season || years[0];
    const rightBody = await singleSeasonTableHtml(defaultYear);
    setMain(`
      <div class="standings-grid">
        <div class="panel">
          <h2>Overall Standings</h2>
          <p class="sub">All-time record across every Yahoo and Sleeper season on file</p>
          ${allTimeTableHtml(totals)}
        </div>
        <div class="panel">
          <h2>Season Standings</h2>
          <div class="season-picker" style="margin:-4px 0 14px;">
            <label style="font-size:12px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;">YEAR</label>
            <select id="standingsYearSelect">
              ${years.map(y => `<option value="${y}" ${y===defaultYear?"selected":""}>${y}</option>`).join("")}
            </select>
          </div>
          <div id="standingsYearBody">${rightBody}</div>
        </div>
      </div>`);
    document.getElementById("standingsYearSelect").addEventListener("change", async (e) => {
      const body = document.getElementById("standingsYearBody");
      body.innerHTML = loadingMsg("Loading…");
      body.innerHTML = await singleSeasonTableHtml(e.target.value);
    });
  }catch(e){ setMain(errorMsg("Couldn't load standings: " + e.message)); }
}

    const byId = {};

      if(m.matchup_id == null) return;

    });
    const pairs = Object.values(byId).filter(p => p.length===2);
    let body;
    if(!pairs.length){
      body = `<div class="state-msg">No matchup data for Week ${activeWeek} yet.</div>`;
    } else {
      body = pairs.map(([a,b]) => {
        const ta = data.teams[a.roster_id] || {name:"Unknown"};
        const tb = data.teams[b.roster_id] || {name:"Unknown"};
        const aw = a.points > b.points, bw = b.points > a.points;
        return `<div class="matchup-row">
          <div class="mt-team">${ta.name}</div>
          <div class="mt-score ${aw?'win':''}">${(a.points??0).toFixed(1)}</div>
          <div class="mt-vs">vs</div>
          <div class="mt-score ${bw?'win':''}">${(b.points??0).toFixed(1)}</div>
          <div class="mt-team right">${tb.name}</div>
        </div>`;
      }).join("");
    }
    setMain(`
      <div class="panel">
        <h2>Matchups</h2>
        <p class="sub">Weekly scores, pulled live from Sleeper</p>
        <div class="season-picker" style="margin:-4px 0 14px;">
          <label style="font-size:12px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;">SEASON</label>
          <select id="matchupsYearSelect">
            ${seasonYears.map(y => `<option value="${y}" ${y===activeSeason?"selected":""}>${y}</option>`).join("")}
          </select>
        </div>
        <div class="week-picker" id="weekPicker">${weekBtns}</div>
        ${body}
      </div>`);
    document.querySelectorAll("#weekPicker button").forEach(b=>{
      b.addEventListener("click", ()=>{ activeWeek = parseInt(b.dataset.week); renderMatchups(); });
    });
    document.getElementById("matchupsYearSelect").addEventListener("change", (e)=>{
      activeSeason = e.target.value; activeWeek = 1; renderMatchups();
    });
  }catch(e){ setMain(errorMsg("Couldn't load matchups: " + e.message)); }
}

function yahooPlayoffBracketHtml(year){
  const b = YAHOO_BRACKETS[year];
  if(!b) return `<div class="state-msg">No bracket data.</div>`;
  const weekKeys = Object.keys(b.weeks).sort((a,b)=>a-b);
  const cols = weekKeys.map((wk,i) => {
    const colLabel = i === weekKeys.length-1 ? "Championship" : `Round ${i+1}`;
    const gamesThisWeek = b.games.filter(g => g[1] === wk);
    const cards = gamesThisWeek.map(([roundLabel, week, teams]) => {
      if(teams.length === 1){
        const [seed, team] = teams[0];
        return `<div class="bracket-card bye-card">
          <div class="bracket-game-label">${roundLabel}</div>
          <div class="bracket-team winner"><span class="seed">${seed}</span><span class="bracket-team-name">${team}</span></div>
          <div class="bracket-team bye-slot"><span class="seed"></span><span class="bracket-team-name">BYE</span></div>
        </div>`;
      }
      const [[s1,t1,sc1],[s2,t2,sc2]] = teams;
      const t1Win = sc1 > sc2;
      return `<div class="bracket-card">
        <div class="bracket-game-label">${roundLabel}</div>
        <div class="bracket-team ${t1Win?'winner':''}"><span class="seed">${s1}</span><span class="bracket-team-name">${t1}</span><span class="num">${sc1.toFixed(1)}</span></div>
        <div class="bracket-team ${!t1Win?'winner':''}"><span class="seed">${s2}</span><span class="bracket-team-name">${t2}</span><span class="num">${sc2.toFixed(1)}</span></div>
      </div>`;
    }).join("");
    return `<div class="bracket-col"><div class="bracket-col-label">${colLabel} · Wk ${wk}</div><div class="bracket-col-games">${cards}</div></div>`;
  }).join("");
  return `<div class="bracket-wrap">${cols}</div>`;
}

async function sleeperPlayoffBracketHtml(year){
  const entry = seasons.find(s => s.season === year);
  const data = await loadSeasonCore(entry);
  let bracket;
  try{ bracket = await getJSON(`${API}/league/${entry.league_id}/winners_bracket`); }
  catch(e){ return `<div class="state-msg">No bracket data.</div>`; }
  if(!bracket || !bracket.length) return `<div class="state-msg">No bracket data yet.</div>`;

  let leagueInfo = null;
  try{ leagueInfo = await getJSON(`${API}/league/${entry.league_id}`); }catch(e){}
  const playoffStartWeek = leagueInfo?.settings?.playoff_week_start || null;

  // Sleeper's bracket API doesn't include seed numbers directly; seeding
  // follows final regular-season standing, same sort used elsewhere.
  const seedOrder = Object.values(data.teams).sort((a,b) =>
    b.wins - a.wins || (b.fpts - b.fpts_against) - (a.fpts - a.fpts_against)
  );
  const seedByRoster = {};
  seedOrder.forEach((t,i) => { seedByRoster[t.roster_id] = i+1; });

  // A team has a bye when it appears in a round after the first WITHOUT a
  // matching t1_from/t2_from key (it didn't earn that slot by winning/losing
  // an earlier game). The bye belongs visually in Round 1 — that's the round
  // they sat out — not the later round where they first actually play.
  const rounds = {};
  bracket.forEach(g => { (rounds[g.r] = rounds[g.r]||[]).push(g); });
  const roundNums = Object.keys(rounds).map(Number).sort((a,b)=>a-b);
  const minRound = roundNums[0];

  const byeTeamIds = [];
  roundNums.filter(r => r > minRound).forEach(r => {
    rounds[r].forEach(g => {
      if(g.t1 != null && !("t1_from" in g)) byeTeamIds.push(g.t1);
      if(g.t2 != null && !("t2_from" in g)) byeTeamIds.push(g.t2);
    });
  });
  byeTeamIds.sort((a,b) => (seedByRoster[a]||99) - (seedByRoster[b]||99));

  const pointsByRound = {};
  if(playoffStartWeek){
    for(const r of roundNums){
      const wk = playoffStartWeek + (r - minRound);
      try{
        const m = await getMatchups(year, wk);
        const map = {};
        (m||[]).forEach(x => { map[x.roster_id] = x.points; });
        pointsByRound[r] = { week: wk, map };
      }catch(e){}
    }
  }

  function gameLabel(g, roundIdx, totalRounds){
    if(g.p === 1) return "Final";
    if(g.p === 3) return "3rd Place Game";
    if(g.p === 5) return "5th Place Game";
    if(g.p === 7) return "7th Place Game";
    if(roundIdx === totalRounds-1) return "Final";
    if(roundIdx === 0) return "Quarterfinal";
    return "Semifinal";
  }

  const cols = roundNums.map((r,i) => {
    const label = i === roundNums.length-1 ? "Championship" : `Round ${i+1}`;
    const wkInfo = pointsByRound[r];
    const isFirstRound = (r === minRound);
    const gamesSorted = rounds[r].slice().sort((a,b) => {
      // Primary: the bracket's own placement field, so the Final (p=1) always
      // sorts before a 3rd/5th place game (p=3/5), even if seed math alone
      // would suggest otherwise (e.g. both bye-seeds losing their semifinal
      // and meeting in the 3rd-place game instead of the final).
      const pa = a.p ?? -1, pb = b.p ?? -1;
      if(pa !== pb) return pa - pb;
      const minA = Math.min(seedByRoster[a.t1]??99, seedByRoster[a.t2]??99);
      const minB = Math.min(seedByRoster[b.t1]??99, seedByRoster[b.t2]??99);
      // Round 1: real games run highest-lower-seed-first (4v5 before 3v6),
      // matching the Yahoo bracket convention. Later rounds: lowest seed first.
      return isFirstRound ? (minB - minA) : (minA - minB);
    });
    function byeCardHtml(tid){
      const t = data.teams[tid];
      return `<div class="bracket-card bye-card">
        <div class="bracket-game-label">Quarterfinal</div>
        <div class="bracket-team winner"><span class="seed">${seedByRoster[tid]||''}</span><span class="bracket-team-name">${t?t.name:'TBD'}</span></div>
        <div class="bracket-team bye-slot"><span class="seed"></span><span class="bracket-team-name">BYE</span></div>
      </div>`;
    }
    const cards = gamesSorted.map(g => {
      const t1 = g.t1 != null ? data.teams[g.t1] : null;
      const t2 = g.t2 != null ? data.teams[g.t2] : null;
      const s1 = g.t1 != null ? seedByRoster[g.t1] : null;
      const s2 = g.t2 != null ? seedByRoster[g.t2] : null;
      const t1Score = (wkInfo && g.t1 != null) ? wkInfo.map[g.t1] : null;
      const t2Score = (wkInfo && g.t2 != null) ? wkInfo.map[g.t2] : null;
      const t1Win = g.w != null && g.w === g.t1;
      const t2Win = g.w != null && g.w === g.t2;
      const lbl = gameLabel(g, i, roundNums.length);
      return `<div class="bracket-card">
        <div class="bracket-game-label">${lbl}</div>
        <div class="bracket-team ${t1Win?'winner':''}"><span class="seed">${s1||''}</span><span class="bracket-team-name">${t1?t1.name:'TBD'}</span>${t1Score!=null?`<span class="num">${t1Score.toFixed(1)}</span>`:""}</div>
        <div class="bracket-team ${t2Win?'winner':''}"><span class="seed">${s2||''}</span><span class="bracket-team-name">${t2?t2.name:'TBD'}</span>${t2Score!=null?`<span class="num">${t2Score.toFixed(1)}</span>`:""}</div>
      </div>`;
    });
    let orderedCards = cards;
    if(isFirstRound && byeTeamIds.length){
      // byeTeamIds is sorted ascending by seed. Lowest seed's bye goes at the
      // very top of the round, highest seed's bye at the very bottom —
      // matching Yahoo's [1-Bye, 4v5, 3v6, 2-Bye] layout.
      const half = Math.ceil(byeTeamIds.length / 2);
      const frontByes = byeTeamIds.slice(0, half).map(byeCardHtml);
      const backByes = byeTeamIds.slice(half).map(byeCardHtml);
      orderedCards = [...frontByes, ...cards, ...backByes];
    }
    return `<div class="bracket-col"><div class="bracket-col-label">${label}${wkInfo?` · Wk ${wkInfo.week}`:""}</div><div class="bracket-col-games">${orderedCards.join("")}</div></div>`;
  }).join("");
  return `<div class="bracket-wrap">${cols}</div>`;
}

let historyOpenYear = null;
async function toggleHistoryDetail(year){
  const el = document.getElementById(`history-detail-${year}`);
  const rowEl = document.querySelector(`.history-season[data-year="${year}"]`);
  if(historyOpenYear === year){
    el.classList.remove("open");
    rowEl.classList.remove("expanded");
    historyOpenYear = null;
    return;
  }
  if(historyOpenYear){
    const prevEl = document.getElementById(`history-detail-${historyOpenYear}`);
    const prevRow = document.querySelector(`.history-season[data-year="${historyOpenYear}"]`);
    if(prevEl){ prevEl.classList.remove("open"); prevEl.innerHTML = ""; }
    if(prevRow) prevRow.classList.remove("expanded");
  }
  historyOpenYear = year;
  rowEl.classList.add("expanded");
  el.classList.add("open");
  el.innerHTML = loadingMsg("Loading standings and bracket…");
  const isYahoo = !!YAHOO_SEASONS.find(y => y.season === year);
  const [standingsHtml, bracketHtml] = await Promise.all([
    singleSeasonTableHtml(year),
    isYahoo ? Promise.resolve(yahooPlayoffBracketHtml(year)) : sleeperPlayoffBracketHtml(year),
  ]);
  el.innerHTML = `
    <div class="history-detail-inner">
      <h3 class="section-h">Playoff Bracket</h3>
      ${bracketHtml}
      <h3 class="section-h" style="margin-top:22px;">Full Season Standings</h3>
      ${standingsHtml}
    </div>`;
}

async function renderHistory(){
  setMain(loadingMsg("Loading season history — this walks every prior season, give it a moment…"));
  try{
    historyOpenYear = null;
    const rowsHtml = [];
    for(const entry of seasons){
      if(entry.status === "pre_draft" || entry.status === "drafting"){
        rowsHtml.push(historyRowHtml(entry.season, {upcoming:true}));
        continue;
      }
      const data = await loadSeasonCore(entry);
      const { champion, champOwner, runnerUp, runnerUpOwner } = await getSeasonChampionRunnerUp(entry.season);
      const rows = Object.values(data.teams).sort((a,b)=>b.wins-a.wins || (b.fpts-b.fpts_against)-(a.fpts-a.fpts_against));
      const best = rows[0];
      const highest = rows.slice().sort((a,b)=>b.fpts-a.fpts)[0];
      rowsHtml.push(historyRowHtml(entry.season, {
        champion, runnerUp,
        champReal: champOwner ? ownerDisplayName(champOwner) : null,
        runnerReal: runnerUpOwner ? ownerDisplayName(runnerUpOwner) : null,
        bestText: best ? `${best.name} (${best.wins}-${best.losses})` : "—",
        highestText: highest ? `${highest.name} — ${highest.fpts.toFixed(1)} pts` : "—",
      }));
    }
    YAHOO_SEASONS.slice().reverse().forEach(y => {
      const map = TEAM_OWNER_BY_SEASON[y.season] || {};
      const champOwner = map[y.champion.team] || null;
      const runnerUpOwner = y.runnerUp ? (map[y.runnerUp] || null) : null;
      const sorted = y.standings.slice().sort((a,b)=> b.w-a.w || (b.pf-b.pa)-(a.pf-a.pa));
      const best = sorted[0];
      const highest = y.standings.slice().sort((a,b)=>b.pf-a.pf)[0];
      rowsHtml.push(historyRowHtml(y.season, {
        champion: y.champion.team, runnerUp: y.runnerUp,
        champReal: champOwner ? ownerDisplayName(champOwner) : null,
        runnerReal: runnerUpOwner ? ownerDisplayName(runnerUpOwner) : null,
        bestText: best ? `${best.team} (${best.w}-${best.l})` : "—",
        highestText: highest ? `${highest.team} — ${highest.pf.toFixed(1)} pts` : "—",
      }));
    });
    setMain(`
      <div class="panel">
        <h2>League History</h2>
        <p class="sub">Click a season to see the full standings and playoff bracket</p>
        ${rowsHtml.join("")}
      </div>`);
    document.querySelectorAll(".history-season.clickable").forEach(el => {
      el.addEventListener("click", () => toggleHistoryDetail(el.dataset.year));
    });
  }catch(e){ setMain(errorMsg("Couldn't load history: " + e.message)); }
}

async function renderAchievements(){
  setMain(loadingMsg("Crunching every matchup across league history — this can take a bit…"));
  try{
    let highest = {pts:-1};
    let blowout = {margin:-1};
    let closest = {margin:99999};
    const teamTotals = {}; // handle -> {name, wins, losses, pf}
    const champs = {};     // handle -> count

    for(const entry of seasons){
      if(entry.status === "pre_draft" || entry.status === "drafting") continue;
      const data = await loadSeasonCore(entry);
      Object.values(data.teams).forEach(t => {
        const rec = teamTotals[t.handle] || {name:t.name, handle:t.handle, wins:0, losses:0, pf:0};
        rec.wins += t.wins; rec.losses += t.losses; rec.pf += t.fpts; rec.name = t.name;
        teamTotals[t.handle] = rec;
      });
      try{
        const bracket = await getJSON(`${API}/league/${entry.league_id}/winners_bracket`);
        const final = bracket.find(g => g.p === 1 && g.w);
        if(final){
          const champ = data.teams[final.w];
          if(champ) champs[champ.handle] = (champs[champ.handle]||0) + 1;
        }
      }catch(e){}

      for(let w=1; w<=17; w++){
        let m;
        try{ m = await getMatchups(entry.season, w); }catch(e){ continue; }
        if(!m || !m.length) continue;
        const byId = {};
        m.forEach(x => { if(x.matchup_id!=null) (byId[x.matchup_id]=byId[x.matchup_id]||[]).push(x); });
        Object.values(byId).forEach(pair => {
          pair.forEach(x => {
            const t = data.teams[x.roster_id];
            if(t && x.points > highest.pts) highest = {pts:x.points, team:t.name, season:entry.season, week:w};
          });
          if(pair.length===2){
            const [a,b] = pair;
            const ta = data.teams[a.roster_id], tb = data.teams[b.roster_id];
            if(ta && tb && a.points!=null && b.points!=null){
              const margin = Math.abs(a.points-b.points);
              const winner = a.points>b.points?ta:tb, loser=a.points>b.points?tb:ta;
              if(margin > blowout.margin) blowout = {margin, winner:winner.name, loser:loser.name, season:entry.season, week:w};
              if(margin < closest.margin && (a.points>0||b.points>0)) closest = {margin, winner:winner.name, loser:loser.name, season:entry.season, week:w};
            }
          }
        });
      }
    }
    // Fold in Yahoo-era championships (2017-2023) for owners we can confidently map by name
    YAHOO_SEASONS.forEach(y => {
      const owner = YAHOO_MANAGER_TO_OWNER[y.champion.manager];
      if(owner) champs[owner] = (champs[owner]||0) + 1;
    });
    const topChamp = Object.entries(champs).sort((a,b)=>b[1]-a[1])[0];
    const topWinPct = Object.values(teamTotals).sort((a,b)=> (b.wins/(b.wins+b.losses||1)) - (a.wins/(a.wins+a.losses||1)))[0];

    setMain(`
      <div class="panel">
        <h2>Achievements</h2>
        <p class="sub">Records computed across every completed season on file</p>
        <div class="trophy-grid">
          <div class="trophy-card"><div class="trophy-label">Highest Single-Week Score</div>
            <div class="trophy-value">${highest.pts>=0?highest.pts.toFixed(1):"—"}</div>
            <div class="trophy-sub">${highest.team||""} · ${highest.season||""} Wk ${highest.week||""}</div></div>
          <div class="trophy-card"><div class="trophy-label">Biggest Blowout</div>
            <div class="trophy-value">${blowout.margin>=0?blowout.margin.toFixed(1):"—"} pts</div>
            <div class="trophy-sub">${blowout.winner||""} over ${blowout.loser||""} · ${blowout.season||""} Wk ${blowout.week||""}</div></div>
          <div class="trophy-card"><div class="trophy-label">Closest Finish</div>
            <div class="trophy-value">${closest.margin<99999?closest.margin.toFixed(1):"—"} pts</div>
            <div class="trophy-sub">${closest.winner||""} over ${closest.loser||""} · ${closest.season||""} Wk ${closest.week||""}</div></div>
          <div class="trophy-card"><div class="trophy-label">Most Championships</div>
            <div class="trophy-value">${topChamp ? topChamp[1] : "—"}</div>
            <div class="trophy-sub">${topChamp ? (teamTotals[topChamp[0]]?.name || OWNER_NAMES[topChamp[0]] || topChamp[0]) : ""}</div></div>
          <div class="trophy-card"><div class="trophy-label">Best All-Time Win %</div>
            <div class="trophy-value">${topWinPct ? (100*topWinPct.wins/(topWinPct.wins+topWinPct.losses||1)).toFixed(0)+"%" : "—"}</div>
            <div class="trophy-sub">${topWinPct ? `${topWinPct.name} (${topWinPct.wins}-${topWinPct.losses})` : ""}</div></div>
        </div>
      </div>`);
  }catch(e){ setMain(errorMsg("Couldn't compute achievements: " + e.message)); }
}

async function getSeasonWeeklySeries(year){
  // Returns { teamLabels: [...], weeks: [1,2,...], series: [{name, data:[...]}] }
  const yahoo = YAHOO_WEEKLY[year];
  if(yahoo){
    const teams = Object.keys(yahoo);
    const maxWeek = Math.max(...teams.map(t => Math.max(...Object.keys(yahoo[t]).map(Number))));
    const weeks = Array.from({length:maxWeek}, (_,i)=>i+1);
    const map = TEAM_OWNER_BY_SEASON[year] || {};
    const series = teams.map(team => ({
      name: team,
      owner: map[team] || null,
      data: weeks.map(w => yahoo[team][String(w)] ?? null),
    }));
    return { weeks, series };
  }
  // Sleeper season - fetch live
  const entry = seasons.find(s => s.season === year);
  const data = await loadSeasonCore(entry);
  const teamsByRoster = data.teams;
  const perTeam = {}; // roster_id -> array indexed by week-1
  const weeks = [];
  for(let w=1; w<=17; w++){
    let m;
    try{ m = await getMatchups(year, w); }catch(e){ break; }
    if(!m || !m.length) break;
    weeks.push(w);
    m.forEach(x => {
      if(!perTeam[x.roster_id]) perTeam[x.roster_id] = [];
      perTeam[x.roster_id][w-1] = (x.points!=null) ? x.points : null;
    });
  }
  const series = Object.keys(perTeam).map(rid => {
    const t = teamsByRoster[rid];
    return { name: t ? t.name : `Team ${rid}`, owner: t ? t.handle : null,
      data: weeks.map(w => perTeam[rid][w-1] ?? null) };
  });
  return { weeks, series };
}

// ---------- TEAMS ----------
async function getOwnerCareerData(owner){
  const seasonsData = [];

  // Yahoo era
  for(const y of YAHOO_SEASONS){
    const map = TEAM_OWNER_BY_SEASON[y.season] || {};
    const team = Object.keys(map).find(t => map[t] === owner);
    if(!team) continue;
    const row = y.standings.find(s => s.team === team);
    if(!row) continue;
    const champ = YAHOO_MANAGER_TO_OWNER[y.champion.manager] === owner;
    seasonsData.push({ year: y.season, team, wins: row.w, losses: row.l, ties: row.t || 0,
      pf: row.pf, pa: row.pa, champion: champ, source: "yahoo" });
  }

  // Sleeper era
  for(const entry of seasons){
    if(entry.status === "pre_draft" || entry.status === "drafting") continue;
    const data = await loadSeasonCore(entry);
    const t = Object.values(data.teams).find(x => x.handle === owner);
    if(!t) continue;
    let champ = false;
    try{
      const bracket = await getJSON(`${API}/league/${entry.league_id}/winners_bracket`);
      const final = bracket.find(g => g.p === 1 && g.w);
      if(final && data.teams[final.w] && data.teams[final.w].handle === owner) champ = true;
    }catch(e){}
    seasonsData.push({ year: entry.season, team: t.name, wins: t.wins, losses: t.losses,
      ties: t.ties || 0, pf: t.fpts, pa: t.fpts_against, champion: champ, source: "sleeper" });
  }

  seasonsData.sort((a,b) => a.year.localeCompare(b.year));

  const totals = seasonsData.reduce((acc,s) => {
    acc.wins += s.wins; acc.losses += s.losses; acc.ties += s.ties;
    acc.pf += s.pf; acc.pa += s.pa; acc.titles += s.champion ? 1 : 0;
    return acc;
  }, {wins:0, losses:0, ties:0, pf:0, pa:0, titles:0});

  // Weekly bests/worsts across career
  let best = {score:-1}, worst = {score:999999};
  for(const s of seasonsData){
    if(s.source === "yahoo"){
      const wk = (YAHOO_WEEKLY[s.year] && YAHOO_WEEKLY[s.year][s.team]) || {};
      Object.entries(wk).forEach(([w,score]) => {
        if(score == null) return;
        if(score > best.score) best = {score, season:s.year, week:w};
        if(score < worst.score) worst = {score, season:s.year, week:w};
      });
    } else {
      const entry = seasons.find(e => e.season === s.year);
      const data = await loadSeasonCore(entry);
      const t = Object.values(data.teams).find(x => x.handle === owner);
      if(!t) continue;
      for(let w=1; w<=17; w++){
        let m;
        try{ m = await getMatchups(s.year, w); }catch(e){ break; }
        if(!m || !m.length) break;
        const mine = m.find(x => x.roster_id === t.roster_id);
        if(mine && mine.points != null){
          if(mine.points > best.score) best = {score:mine.points, season:s.year, week:w};
          if(mine.points < worst.score) worst = {score:mine.points, season:s.year, week:w};
        }
      }
    }
  }

  return { seasonsData, totals, best, worst };
}

      </div>
      <h3 class="section-h">Points For by Season</h3>
      <div style="position:relative; height:280px; margin-bottom:26px;"><canvas id="teamPfChart"></canvas></div>
      <h3 class="section-h">Season by Season</h3>
      <table style="margin-bottom:26px;">
        <thead><tr><th>Year</th><th>Team Name</th><th class="num">Record</th><th class="num">PF</th><th class="num">PA</th><th></th></tr></thead>
        <tbody>${seasonsData.map(s => `
          <tr>
            <td>${s.year}</td><td>${s.team}</td>

function computeNextYearEligibility(owner){
  const roster = WK18_ROSTERS[owner] || [];
  const keeperMap = {};
  KEEPERS_2025.filter(k => k.owner === owner).forEach(k => keeperMap[k.player] = k);

  return roster.map(p => {
    const asKeeper = keeperMap[p.player];
    if(asKeeper){
      const nextRound = asKeeper.round - 1;
      const underCap = asKeeper.year < 3;
      const aboveFloor = nextRound >= 3; // keeping again can't drop the cost into rounds 1-2
      const eligible = underCap && aboveFloor;
      let reason = "";
      if(!eligible){
        reason = !underCap
          ? "Max 3 consecutive years reached"
          : "Next year's cost would drop to round " + nextRound + " (rounds 1-3 restriction)";
      }
      return {
        player: p.player, pos: p.pos,
        acquired: `Kept (Rd ${asKeeper.round} this year, ${ordYear(asKeeper.year)} yr)`,
        nextRound: eligible ? nextRound : null,
        eligible,
        reason,
      };
    }
    if(p.draftpos === "FA"){
      return { player: p.player, pos: p.pos, acquired: "Free agency pickup",
        nextRound: 9, eligible: true, reason: "" };
    }
    const rd = p.draftpos;
    if(typeof rd === "number" && rd <= 3){
      return { player: p.player, pos: p.pos, acquired: `Drafted Rd ${rd}`,
        nextRound: null, eligible: false, reason: "Rounds 1-3 never keeper-eligible" };
    }
    return { player: p.player, pos: p.pos, acquired: `Drafted Rd ${rd}`,
      nextRound: (typeof rd === "number") ? rd - 1 : null, eligible: true, reason: "" };
  }).sort((a,b) => {
    if(a.eligible !== b.eligible) return a.eligible ? -1 : 1;
    return (a.nextRound ?? 99) - (b.nextRound ?? 99);
  });
}

function keeperTeamBlockHtml(owner){
  const byOwner = {};
  KEEPERS_2025.forEach(k => (byOwner[k.owner] = byOwner[k.owner]||[]).push(k));
  const keepers = byOwner[owner] || [];
  const rows = keepers.map(k => `
    <tr>
      <td>${k.player}</td>
      <td>${k.pos}</td>
      <td class="num">Rd ${k.round}</td>
      <td class="num"><span class="year-tag ${k.year===1?'first':k.year>=3?'maxed':''}">${ordYear(k.year)}${k.year>=3?' · max':''}</span></td>
    </tr>`).join("");

  const eligibility = computeNextYearEligibility(owner);
  const eligRows = eligibility.map(e => `
    <tr class="${e.eligible?'':'ineligible-row'}">
      <td>${e.player}</td>
      <td>${e.pos}</td>
      <td class="num">${e.acquired}</td>
      <td class="num">${e.eligible ? `Rd ${e.nextRound}` : `<span style="color:var(--ink-dim); font-size:11px;">${e.reason}</span>`}</td>
    </tr>`).join("");

  const keeperHistory = (KEEPER_HISTORY[owner] || []).slice().sort((a,b) => b.season.localeCompare(a.season) || a.player.localeCompare(b.player));
  const keeperBySeason = {};
  keeperHistory.forEach(k => (keeperBySeason[k.season] = keeperBySeason[k.season]||[]).push(k));
  const keeperSeasonKeys = Object.keys(keeperBySeason).sort((a,b) => b.localeCompare(a));
  const historyRows = keeperSeasonKeys.length ? keeperSeasonKeys.map(season => `
    <tr class="season-group-row"><td colspan="4">${season}</td></tr>
    ${keeperBySeason[season].map(k => `
      <tr>
        <td>${k.player}</td><td>${k.pos}</td>
        <td class="num">Rd ${k.round}</td>
        <td class="num"><span class="year-tag ${k.year===1?'first':k.year>=3?'maxed':''}">${ordYear(k.year)}${k.year>=3?' · max':''}</span></td>
      </tr>`).join("")}`).join("") : `<tr><td colspan="4" style="color:var(--ink-dim);">No keepers on file</td></tr>`;

  return `<div class="team-block">
    <h3>${OWNER_NAMES[owner]} <span class="handle">@${owner}</span></h3>
    <div class="keepers-grid">
      <div>
        <p class="sub" style="margin:0 0 8px;">Current keepers (2025-26)</p>
        <table>
          <thead><tr><th>Player</th><th>Pos</th><th class="num">Round Kept</th><th class="num">Consecutive Year</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="4" style="color:var(--ink-dim);">No keepers on file</td></tr>`}</tbody>
        </table>
      </div>
      <div>
        <p class="sub" style="margin:0 0 8px;">Eligible for 2026-27 (end-of-season roster)</p>
        <table>
          <thead><tr><th>Player</th><th>Pos</th><th class="num">Acquired</th><th class="num">Cost Next Year</th></tr></thead>
          <tbody>${eligRows || `<tr><td colspan="4" style="color:var(--ink-dim);">No roster data</td></tr>`}</tbody>
        </table>
      </div>
    </div>
    <h3 class="section-h" style="margin-top:26px;">Keeper History</h3>
    <p class="sub">Every keeper this owner has used since the league's keeper rule began in 2020</p>
    <table>
      <thead><tr><th>Player</th><th>Pos</th><th class="num">Round Kept</th><th class="num">Year</th></tr></thead>
      <tbody>${historyRows}</tbody>
    </table>
  </div>`;
}

function renderKeepers(){
  const owners = Object.keys(OWNER_NAMES);

}

  }catch(e){
    setMain(errorMsg("Couldn't connect to Sleeper for league " + STARTING_LEAGUE_ID + ": " + e.message +
      ". Double-check the league ID and that this league is public/accessible."));
  }
}
